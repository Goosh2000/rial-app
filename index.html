function csvParseRow(r, map){
  const dateRaw = map.date >= 0 ? r[map.date] : "";
  let amtRaw = map.amount >= 0 ? r[map.amount] : "";
  let type = "expense";
  let amt = U.toBaisa((amtRaw||"").replace(/[()]/g,"").replace(/,/g,""));
  if (map.credit >= 0 && r[map.credit] && U.toBaisa(r[map.credit]) > 0){ amt = U.toBaisa(r[map.credit]); type = "income"; }
  else if (/-/.test(amtRaw) || /^\(.*\)$/.test((amtRaw||"").trim())){ amt = Math.abs(amt); type = "expense"; }
  else if (amt < 0){ amt = Math.abs(amt); }
  else if (map.credit < 0 && amt > 0 && /cr|credit|salary|deposit/i.test(r[map.desc]||"")) type = "income";
  const ymd = guessDate(dateRaw);
  const desc = (map.desc >= 0 ? r[map.desc] : "").trim();
  return { ymd, ts:U.parseYMD(ymd), month:ymd.slice(0,7), amount:Math.abs(amt), type, note:desc, category: type==="income"?"Other income":"Other", source:"csv" };
}
function isDuplicate(rec){
  return S.tx.some(t => t.amount === rec.amount && U.ymd(new Date(t.ts)) === rec.ymd &&
    (t.note||"").toLowerCase().slice(0,20) === (rec.note||"").toLowerCase().slice(0,20));
}
function csvPreview(){
  const s = csvState;
  s.map = { date:+gv("mapDate"), amount:+gv("mapAmt"), credit:+gv("mapCredit"), desc:+gv("mapDesc") };
  s.remember = FULL.querySelector("#mapRemember").checked;
  const parsed = s.rows.map(r => csvParseRow(r, s.map)).filter(p => p.amount > 0);
  s.parsed = parsed.map(p => ({ ...p, dup: isDuplicate(p), pick: !isDuplicate(p) }));
  const dups = s.parsed.filter(p => p.dup).length;
  FULL.querySelector("#csvReview").innerHTML = `
    <div class="card">
      <div class="row between" style="margin-bottom:8px"><b style="font-size:15px">${s.parsed.length} rows · ${dups} look like duplicates</b></div>
      ${s.parsed.map((p,i) => `<div class="tx">
        <input type="checkbox" data-csv-pick="${i}" ${p.pick?"checked":""}/>
        <div class="mid"><div class="t1">${esc(p.note||"(no description)")}</div>
          <div class="t2">${p.ymd} · ${p.type}${p.dup?" · <span style='color:var(--warn)'>dup</span>":""}</div></div>
        <div class="amt mono ${p.type==='income'?'pos':''}">${U.fmt(p.amount)}</div>
      </div>`).join("")}
      <button class="btn primary block" id="csvCommit" style="margin-top:10px">Import selected</button>
    </div>`;
  FULL.querySelectorAll("[data-csv-pick]").forEach(cb => cb.addEventListener("change", () => s.parsed[cb.dataset.csvPick].pick = cb.checked));
  FULL.querySelector("#csvCommit").addEventListener("click", csvCommit);
}
async function csvCommit(){
  const s = csvState;
  const chosen = s.parsed.filter(p => p.pick);
  for (const p of chosen){
    await DB.put("transactions", { id:U.uid(), ts:p.ts, month:p.month, amount:p.amount, type:p.type,
      category:p.category, note:p.note, source:"csv" });
  }
  if (s.remember) await DB.setMeta("csvMapping", { ...s.map, sig:s.sig });
  await refresh(); closeFull(); toast(`Imported ${chosen.length} transactions`); render();
}

/* ============ [S] SMS PARSER (from parser.js) + review flow ========= */
/* PARSER:START */
/* SMS parser — generated from parser.js by build-parser.js. Edit parser.js, then: node build-parser.js */
const SmsParser = (() => {

  /* --- money: string -> integer baisa (OMR x 1000), no floating point --- */
  function toBaisa(s) {
    const m = String(s).replace(/,/g, "").match(/(\d+)(?:\.(\d{1,3}))?/);
    if (!m) return 0;
    const whole = parseInt(m[1], 10);
    const frac = (m[2] || "").padEnd(3, "0").slice(0, 3);
    return whole * 1000 + parseInt(frac, 10);
  }

  /* --- dates: DD/MM/YYYY (day first) --- */
  function parseDMY(s) {
    const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    const d = +m[1], mo = +m[2], y = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return { y, m: mo, d, ymd: `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}` };
  }
  function makeTs(dmy, time) {
    if (!dmy) return null;
    if (time) {
      const [hh, mm, ss] = time.split(":").map(Number);
      return new Date(dmy.y, dmy.m - 1, dmy.d, hh, mm, ss || 0).getTime();
    }
    // no time -> end of day, so it sorts last within that day
    return new Date(dmy.y, dmy.m - 1, dmy.d, 23, 59, 59).getTime();
  }

  /* --- account tokens: keep ONLY the trailing 4 digits, discard everything else --- */
  function last4(token) {
    if (token == null) return null;
    const digits = String(token).replace(/\D/g, "");   // transient; never stored
    return digits.length >= 4 ? digits.slice(-4) : null;
  }
  /* scrub masked/!masked account numbers out of free text before we store it */
  function redactAccountNumbers(text) {
    return String(text)
      // masked bank tokens: digits + X/#/* + 4 trailing digits  ->  ••••1234
      .replace(/\b[0-9]{2,}[X#*]{2,}[0-9]{4}\b/gi, (t) => "••••" + t.slice(-4))
      // any bare run of 8+ digits (a full number that slipped through) -> ••••1234
      .replace(/\b\d{8,}\b/g, (t) => "••••" + t.slice(-4));
  }

  /* --- merchant -> category --- */
  const DEFAULT_MERCHANT_RULES = [
    { match: "DOMINOS", category: "food" },
    { match: "PIZZA", category: "food" },
    { match: "KFC", category: "food" },
    { match: "MCDONALD", category: "food" },
    { match: "LULU", category: "food" },
    { match: "CARREFOUR", category: "food" },
    { match: "SPAR", category: "food" },
    { match: "NESTO", category: "food" },
    { match: "STARBUCKS", category: "food" },
    { match: "COFFEE", category: "food" },
    { match: "SUPERMARKET", category: "food" },
    { match: "PHARMACY", category: "other" },
    { match: "OOREDOO", category: "subscriptions" },
    { match: "OMANTEL", category: "subscriptions" },
    { match: "NETFLIX", category: "subscriptions" },
    { match: "SPOTIFY", category: "subscriptions" },
    { match: "SHELL", category: "transport" },
    { match: "OOMCO", category: "transport" },
    { match: "AL MAHA", category: "transport" },
    { match: "PETROL", category: "transport" },
    { match: "CAREEM", category: "transport" },
    { match: "UBER", category: "transport" },
    { match: "MARSOOL", category: "transport" },
    { match: "TALABAT", category: "food" },
    { match: "AMAZON", category: "other" },
    { match: "NOON", category: "other" },
  ];
  function categorize(merchant, rules) {
    if (!merchant) return null;
    const up = String(merchant).toUpperCase();
    for (const r of (rules || DEFAULT_MERCHANT_RULES)) {
      if (r && r.match && up.includes(String(r.match).toUpperCase())) return r.category;
    }
    return null;
  }

  /* --- transfer type from the two ends (THE critical rule) --- */
  function resolveTransferType(fromL4, toL4, ownSet) {
    const own = ownSet instanceof Set ? ownSet : new Set(ownSet || []);
    const fromMine = !!fromL4 && own.has(fromL4);
    const toMine = !!toL4 && own.has(toL4);
    if (fromMine && toMine) return "transfer_internal";  // both mine -> nets to zero, NOT spending
    if (fromMine && !toMine) return "transfer_out";       // I sent money away
    if (!fromMine && toMine) return "transfer_in";        // money arrived from elsewhere
    return "review";                                      // can't attribute either end
  }

  /* --- built-in patterns. `groups` maps a field to a capture-group index. --- */
  const DEFAULT_PATTERNS = [
    {
      id: "salary_credit",
      name: "Salary / credit to account",
      re: "^\\s*(.+?)\\s+OMR\\s+([\\d,]+\\.\\d{1,3})\\s+Credited to your Account\\s+(\\d{2}\\/\\d{2}\\/\\d{4})",
      type: "income",
      groups: { source: 1, amount: 2, date: 3 },
    },
    {
      id: "sent_to_person",
      name: "Sent to someone",
      re: "You have sent OMR\\s+([\\d,]+\\.\\d{1,3})\\s+to\\s+(.+?)\\s+from your a\\/c\\s+([0-9X#*]+)\\s+on\\s+(\\d{2}\\/\\d{2}\\/\\d{4})(?:\\s+(\\d{2}:\\d{2}:\\d{2}))?",
      type: "transfer_out",
      groups: { amount: 1, counterparty: 2, fromAcct: 3, date: 4, time: 5 },
    },
    {
      id: "received_from_person",
      name: "Received from someone",
      re: "You have received OMR\\s+([\\d,]+\\.\\d{1,3})\\s+from\\s+(.+?)(?:\\s+on\\s+(\\d{2}\\/\\d{2}\\/\\d{4}))?(?:\\s+(\\d{2}:\\d{2}:\\d{2}))?\\s*\\.?\\s*$",
      type: "transfer_in",
      groups: { amount: 1, counterparty: 2, date: 3, time: 4 },
    },
    {
      id: "internal_transfer",
      name: "Debited from one A/C, credited to another",
      re: "OMR\\s+([\\d,]+\\.\\d{1,3})\\s+is debited from your A\\/C\\s+([0-9X#*]+)\\s+and credited to your A\\/C\\s+([0-9X#*]+)\\s+on\\s+(\\d{2}\\/\\d{2}\\/\\d{4})(?:\\s+(\\d{2}:\\d{2}:\\d{2}))?",
      type: "transfer_auto",   // resolved via resolveTransferType
      groups: { amount: 1, fromAcct: 2, toAcct: 3, date: 4, time: 5 },
    },
    {
      id: "card_pos",
      name: "Card / POS purchase",
      re: "Card of a\\/c\\s+([0-9X#*]+)\\s+used for OMR\\s+([\\d,]+\\.\\d{1,3})\\s+at\\s+(.+?)\\s+on\\s+(\\d{2}\\/\\d{2}\\/\\d{4})(?:\\s+(\\d{2}:\\d{2}:\\d{2}))?",
      type: "expense",
      groups: { fromAcct: 1, amount: 2, merchant: 3, date: 4, time: 5 },
    },
  ];

  function cleanName(s) {
    return String(s || "").trim().replace(/\s+/g, " ").replace(/[.,;]+$/, "");
  }

  function dedupeKey(e) {
    const acct = e.fromLast4 || e.toLast4 || "";
    const stamp = e.ts != null ? e.ts : (e.ymd || "");
    return [e.type, e.amount, acct, stamp, cleanName(e.merchant || e.counterparty || "")].join("|");
  }

  /* --- parse a single message block --- */
  function parseOne(raw, ctx) {
    ctx = ctx || {};
    const text = String(raw == null ? "" : raw).trim();
    if (!text) return null;

    const own = ctx.accountLast4 instanceof Set ? ctx.accountLast4 : new Set(ctx.accountLast4 || []);
    const rules = ctx.rules || DEFAULT_MERCHANT_RULES;
    const patterns = (ctx.patterns && ctx.patterns.length) ? ctx.patterns : DEFAULT_PATTERNS;
    const now = ctx.now || Date.now();
    const nowYmd = (() => { const d = new Date(now); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();

    for (const p of patterns) {
      let re;
      try { re = new RegExp(p.re, "i"); } catch { continue; }
      const m = text.match(re);
      if (!m) continue;
      const g = p.groups || {};
      const pick = (k) => (g[k] != null && m[g[k]] != null) ? m[g[k]] : null;

      const amount = toBaisa(pick("amount") || "0");
      const dmy = pick("date") ? parseDMY(pick("date")) : null;
      const time = pick("time") || null;
      const fromLast4 = pick("fromAcct") ? last4(pick("fromAcct")) : null;
      const toLast4 = pick("toAcct") ? last4(pick("toAcct")) : null;
      const merchant = pick("merchant") ? cleanName(pick("merchant")) : null;
      const counterparty = pick("counterparty") ? cleanName(pick("counterparty")) : null;
      const source = pick("source") ? cleanName(pick("source")) : null;

      let type = p.type;
      if (type === "transfer_auto") type = resolveTransferType(fromLast4, toLast4, own);

      let category = null;
      if (type === "expense") category = categorize(merchant, rules);
      if (type === "income" && source && /salary/i.test(source)) category = "salary";

      const ymd = dmy ? dmy.ymd : nowYmd;
      const dateAssumed = !dmy;
      const ts = dmy ? makeTs(dmy, time) : new Date(now).setHours(23, 59, 59, 0);

      const entry = {
        ok: true, matched: p.id, raw: redactAccountNumbers(text),
        type, amount, ymd, time: time, ts, dateAssumed,
        merchant, counterparty,
        category: type === "income" ? (category || (source && /salary/i.test(source) ? "salary" : null)) : category,
        fromLast4, toLast4,
        source: source || (p.type === "income" ? "Salary" : null),
      };
      entry.dedupeKey = dedupeKey(entry);
      // a matched internal-looking transfer that resolved to "review" (neither end mine) still surfaces
      return entry;
    }

    // nothing matched — never drop it. Pull an amount if we can see one.
    const amt = text.match(/OMR\s+([\d,]+\.\d{1,3})/i) || text.match(/([\d,]+\.\d{3})/);
    const dmy = parseDMY(text);
    const entry = {
      ok: true, matched: "review", raw: redactAccountNumbers(text),
      type: "review",
      amount: amt ? toBaisa(amt[1]) : 0,
      ymd: dmy ? dmy.ymd : nowYmd, time: null, ts: dmy ? makeTs(dmy, null) : new Date(now).setHours(23, 59, 59, 0),
      dateAssumed: !dmy,
      merchant: null, counterparty: null, category: null,
      fromLast4: null, toLast4: null, source: null,
    };
    entry.dedupeKey = dedupeKey(entry);
    return entry;
  }

  /* --- split a paste into message blocks and parse each --- */
  function splitBlocks(text) {
    return String(text || "")
      .split(/\n\s*\n|\r\n\s*\r\n/)                 // blank line = message boundary
      .flatMap((b) => b.split(/(?=Dear Customer,)/)) // some banks concat on one line
      .map((b) => b.trim())
      .filter((b) => b.length > 3);
  }
  function parseBatch(text, ctx) {
    return splitBlocks(text).map((b) => parseOne(b, ctx)).filter(Boolean);
  }

  return {
    parseOne, parseBatch, splitBlocks,
    resolveTransferType, categorize, dedupeKey,
    toBaisa, parseDMY, makeTs, last4, redactAccountNumbers, cleanName,
    DEFAULT_PATTERNS, DEFAULT_MERCHANT_RULES,
  };
})();
/* PARSER:END */

const TYPE_LABELS = {

function parserCtx(){

function catNameFor(slug, type){

    || S.cats.find(c => c.name.toLowerCase().includes(slug.toLowerCase()));
  return hit ? hit.name : (slug === "salary" ? "Salary" : "Other");
}

    toAccountId: toAcc ? toAcc.id : null,
    accountId: (fromAcc && fromAcc.id) || primaryId(),
    dedupeKey: p.dedupeKey, rememberRule: false, dup: false,

function markDuplicates(entries){
  const existing = new Set(S.tx.map(t => t.importKey).filter(Boolean));
  const seen = new Set();
  for (const e of entries){
    e.dup = existing.has(e.dedupeKey) || seen.has(e.dedupeKey);
    if (e.dup) e.include = false;
    seen.add(e.dedupeKey);
  }
}

        ` : ""}
      </div>
    </label>
  </div>`;
}
function renderReviewCard(anchor, source){
  const kept = reviewState.filter(e => e.include);
  const flagged = reviewState.filter(e => e.include && e.type === "review").length;
  const dups = reviewState.filter(e => e.dup).length;
  FULL.querySelector(anchor).innerHTML = `
    <div class="card">
      <b style="font-size:15px">Review ${reviewState.length}${dups?` · ${dups} duplicate${dups>1?"s":""} skipped`:""}</b>
      <div class="tiny faint" style="margin:2px 0 6px">Internal transfers are flagged and excluded from spending. Fix anything, then save.</div>
      ${reviewState.map((e,i) => reviewRowHTML(e,i)).join("")}
      ${flagged ? `<div class="tiny" style="color:var(--warn);margin-top:8px">${flagged} entr${flagged>1?"ies":"y"} still need a type.</div>` : ""}
      <button class="btn primary block" id="rvSave" style="margin-top:12px" ${flagged?"disabled style='margin-top:12px;opacity:.5'":""}>Save ${kept.length-flagged}</button>
    </div>`;
  FULL.querySelectorAll("[data-rv]").forEach(el => el.addEventListener("input", () => {
    const e = reviewState[+el.dataset.rv], f = el.dataset.f;
    if (f === "include" || f === "rememberRule") e[f] = el.checked;
    else e[f] = el.value;
    if (f === "type"){
      if (e.type === "expense" && (!e.category || e.category === "Other income")) e.category = e.originalCategory || "Other";
      renderReviewCard(anchor, source);   // type change reshapes the row
    }
    if (f === "amountStr") e.amount = U.toBaisa(el.value);
  }));
  const btn = FULL.querySelector("#rvSave");
  if (btn && !flagged) btn.addEventListener("click", () => saveReview(source));
}
function openReview(parsed, opts){
  reviewState = parsed.map(toReviewEntry);
  markDuplicates(reviewState);
  renderReviewCard(opts.anchor, opts.source);
}
async function saveReview(source){
  let n = 0; const learnedRules = [];
  for (const e of reviewState){
    if (!e.include || e.type === "review") continue;
    const amt = U.toBaisa(e.amountStr); if (amt <= 0) continue;
    const ymd = /^\d{4}-\d{2}-\d{2}$/.test(e.ymd) ? e.ymd : U.ymd();
    const ts = e.time ? U.parseYMD(ymd) + hmsToMs(e.time) - 12*3600000 : U.parseYMD(ymd) + 43199000;
    const base = { id: U.uid(), ts, month: ymd.slice(0,7), amount: amt, source, importKey: e.dedupeKey };
    let rec;
    if (e.type === "transfer_internal"){
      if (!e.fromAccountId || !e.toAccountId || e.fromAccountId === e.toAccountId) continue;
      rec = { ...base, type: "transfer_internal", fromAccountId: e.fromAccountId, toAccountId: e.toAccountId,
        note: (e.merchant || e.counterparty || "").trim() };
    } else if (e.type === "transfer_out" || e.type === "transfer_in"){
      rec = { ...base, type: e.type, accountId: e.accountId || primaryId(),
        counterparty: (e.counterparty || "").trim(), category: e.type==="transfer_in"?"Other income":"Other",
        note: (e.counterparty || "").trim() };
    } else {
      rec = { ...base, type: e.type, accountId: e.accountId || primaryId(),
        category: e.type === "income" ? (e.category || "Other income") : (e.category || "Other"),
        note: (e.merchant || "").trim() };
      if (e.type === "expense" && e.rememberRule && e.merchant && e.category){
        learnedRules.push({ match: (e.merchant || "").split(" ")[0].toUpperCase(), category: (e.category || "").toLowerCase() });
      }
    }
    await DB.put("transactions", rec);
    n++;
  }
  if (learnedRules.length){
    const rules = (S.settings.merchantRules || SmsParser.DEFAULT_MERCHANT_RULES).slice();
    for (const r of learnedRules) if (!rules.some(x => x.match === r.match)) rules.unshift(r);
    await DB.setMeta("merchantRules", rules);
  }
  await refresh(); await updateStreak(); closeFull();
  toast(n ? `Saved ${n}${learnedRules.length?` · learned ${learnedRules.length} rule${learnedRules.length>1?"s":""}`:""}` : "Nothing to save");
  render();
}
function hmsToMs(hms){ const [h,m,s] = String(hms).split(":").map(Number); return (h*3600 + m*60 + (s||0)) * 1000; }

/* ============ [T] SCREENSHOT OCR (Tesseract.js, on-device) ========= */
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
let tesseractLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = TESSERACT_URL; s.onload = () => resolve(window.Tesseract);
    s.onerror = () => { tesseractLoading = null; reject(new Error("Couldn't load the OCR engine (needs network the first time)")); };
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
function ocrHTML(){
  return `
  <button class="btn ghost bk" onclick="closeFull()" style="margin-bottom:8px">${svgIcon("back")}Close</button>
  <div class="pagehead"><h1>Scan a screenshot</h1></div>
  <div class="card">
    <p class="tiny faint" style="margin-bottom:10px">Photograph or upload a bank SMS, bank-app screen, or receipt.
      Text recognition runs entirely on this device. The first scan downloads the OCR engine (~2–4 MB) + English data (~10–15 MB), then works offline.</p>
    <input type="file" id="ocrFile" accept="image/*" capture="environment"/>
    <div id="ocrProgress" class="tiny faint" style="margin-top:10px"></div>
  </div>
  <div id="ocrReview"></div>
  `;
}
function wireOCR(){
  FULL.querySelector("#ocrFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const prog = FULL.querySelector("#ocrProgress");
    const thumb = await downscaleImage(f, 700);
    prog.textContent = "Loading OCR engine…";
    let T;
    try { T = await loadTesseract(); } catch (err){ prog.textContent = "Error: " + err.message; return; }
    prog.textContent = "Recognising text… 0%";
    let text = "";
    try {
      const res = await T.recognize(thumb, "eng", { logger: (m) => {
        if (m.status === "recognizing text") prog.textContent = `Recognising text… ${Math.round(m.progress*100)}%`;
      }});
      text = res.data.text || "";
    } catch (err){ prog.textContent = "OCR failed: " + err.message; return; }
    prog.textContent = "Done. Review below.";
    let parsed = SmsParser.parseBatch(text, parserCtx());
    if (!parsed.length){
      parsed = [SmsParser.parseOne(text, parserCtx())].filter(Boolean);
    }
    if (!parsed.length){ prog.textContent = "No transaction found in the image."; return; }
    FULL.querySelector("#ocrReview").innerHTML = `
      <div class="card">
        <div class="row" style="gap:12px;align-items:flex-start">
          <img src="${thumb}" style="width:110px;border-radius:10px;border:1px solid var(--line)"/>
          <div class="tiny faint">OCR is imperfect on bank UIs — check every field. Internal transfers are flagged.</div>
        </div>
      </div>
      <div id="ocrReviewInner"></div>`;
    openReview(parsed, { anchor: "#ocrReviewInner", source: "ocr" });
  });
}

function swState(){
  try { return navigator.serviceWorker && navigator.serviceWorker.controller ? "active" : "registering"; }
  catch { return "n/a"; }
}
async function resetApp(){
  toast("Clearing cache…");
  try {
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs){ try { r.active && r.active.postMessage({ type:"CLEAR_CACHES" }); } catch(_){} await r.unregister(); }
    }
    if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch(e){ console.warn("reset", e); }
  location.reload();
}

/* ============ [QR] byte-mode QR encoder ========================== *
 * Condensed from Project Nayuki's QR Code generator (public domain,
 * https://www.nayuki.io/page/qr-code-generator-library). Byte mode only.
 * QR.encode(text, minEcl) -> { size, modules:boolean[][] }
 * QR.toSVG(qr, opts) -> string     QR.matrixString(qr) -> string (tests)
 * ----------------------------------------------------------------- */
const QR = (() => {
  const ECL = { L:0, M:1, Q:2, H:3 };
  const FORMAT_BITS = [1, 0, 3, 2];             // index by ECL -> format bits
  const ECC_CW_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  ];
  const NUM_ECC_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81],
  ];

  // GF(256) tables (primitive poly 0x11D)
  const EXP = new Uint8Array(256), LOG = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[(LOG[a] + LOG[b]) % 255];

  // Reed-Solomon divisor of length `degree` (nayuki's reedSolomonComputeDivisor)
  function rsDivisor(degree){
    const result = new Array(degree).fill(0);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++){
      for (let j = 0; j < result.length; j++){
        result[j] = gfMul(result[j], root);
        if (j + 1 < result.length) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  }
  function rsRemainder(data, divisor){
    const result = divisor.map(() => 0);
    for (const b of data){
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });
    }
    return result;
  }

  const numRawDataModules = (ver) => {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2){
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  };
  const numDataCodewords = (ver, ecl) =>
    Math.floor(numRawDataModules(ver) / 8)
    - ECC_CW_PER_BLOCK[ecl][ver] * NUM_ECC_BLOCKS[ecl][ver];

  function alignPatternPositions(ver){
    if (ver === 1) return [];
    const num = Math.floor(ver / 7) + 2;
    const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (num * 2 - 2)) * 2;
    const size = ver * 4 + 17;
    const result = [6];
    for (let pos = size - 7; result.length < num; pos -= step) result.splice(1, 0, pos);
    return result;
  }

  function encode(text, minEcl){
    const data = typeof text === "string" ? Array.from(new TextEncoder().encode(text)) : Array.from(text);
    let ecl = minEcl == null ? ECL.L : minEcl;

    // pick smallest version that fits at the chosen ECL
    let version = -1, dataCapacityBits = 0;
    for (let v = 1; v <= 40; v++){
      const cap = numDataCodewords(v, ecl) * 8;
      const charCountBits = v <= 9 ? 8 : 16;
      const need = 4 + charCountBits + data.length * 8;
      if (need <= cap){ version = v; dataCapacityBits = cap; break; }
    }
    if (version === -1) throw new Error("Data too long for a QR code");

    // boost ECL for free if data still fits
    for (const e of [ECL.M, ECL.Q, ECL.H]){
      const charCountBits = version <= 9 ? 8 : 16;
      if (4 + charCountBits + data.length * 8 <= numDataCodewords(version, e) * 8) ecl = e;
    }

    // build bit buffer
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4);                                    // byte mode
    push(data.length, version <= 9 ? 8 : 16);
    for (const b of data) push(b, 8);
    const capacityBits = numDataCodewords(version, ecl) * 8;
    push(0, Math.min(4, capacityBits - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    for (let pad = 0xEC; bits.length < capacityBits; pad ^= 0xEC ^ 0x11) push(pad, 8);

    // bytes -> codewords
    const dataCodewords = [];
    for (let i = 0; i < bits.length; i += 8){
      let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      dataCodewords.push(b);
    }

    // interleave with Reed-Solomon ECC
    const numBlocks = NUM_ECC_BLOCKS[ecl][version];
    const eccLen = ECC_CW_PER_BLOCK[ecl][version];
    const rawCw = Math.floor(numRawDataModules(version) / 8);
    const numShortBlocks = numBlocks - rawCw % numBlocks;
    const shortLen = Math.floor(rawCw / numBlocks) - eccLen;
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++){
      const datLen = shortLen + (i < numShortBlocks ? 0 : 1);
      const dat = dataCodewords.slice(k, k + datLen); k += datLen;
      const ecc = rsRemainder(dat, div);
      if (i < numShortBlocks) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const finalCw = [];
    for (let i = 0; i < blocks[0].length; i++){
      for (let j = 0; j < blocks.length; j++){
        if (i !== shortLen || j >= numShortBlocks) finalCw.push(blocks[j][i]);
      }
    }

    // ---- draw the matrix ----
    const size = version * 4 + 17;
    const modules = Array.from({ length: size }, () => new Array(size).fill(false));
    const isFunc = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFunc = (x, y, dark) => { modules[y][x] = dark; isFunc[y][x] = true; };

    // timing patterns first (finders overwrite the ends)
    for (let i = 0; i < size; i++){ setFunc(6, i, i % 2 === 0); setFunc(i, 6, i % 2 === 0); }

    // finder patterns
    const drawFinder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const xx = cx + dx, yy = cy + dy;
        if (xx < 0 || xx >= size || yy < 0 || yy >= size) continue;
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFunc(xx, yy, dist !== 2 && dist !== 4);
      }
    };
    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);

    // alignment patterns
    const align = alignPatternPositions(version);
    for (let i = 0; i < align.length; i++) for (let j = 0; j < align.length; j++){
      if ((i === 0 && j === 0) || (i === 0 && j === align.length - 1) || (i === align.length - 1 && j === 0)) continue;
      const cx = align[i], cy = align[j];
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setFunc(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }

    // reserve format + version areas (filled after masking)

  if (sch.mode === "off"){ S.settings.themeManual = null; await DB.setMeta("themeManual", null); }
  await DB.setMeta("themeSchedule", sch);
  S.settings.themeSchedule = sch;
  evaluateSchedule();
}

/* ============ [L] THEME LINK SHARING ============================= *
 * A theme travels as https://<pages>/#theme=<payload>. The payload is the
 * URL FRAGMENT only — it never reaches a server. On the receiving side every
 * field is validated STRICTLY: unknown keys, non-strict colours, url()/<>/
 * javascript: etc. => the whole link is rejected, app untouched. Only the
 * palette + a whitelisted font name survive; decorativeCss / fontImports /
 * any audio field are dropped. See THEME-SPEC.md.
 * --------------------------------------------------------------- */
const THEME_LINK = {
  MAX_LINK_CHARS: 2800,      // <#theme=…> payload
  MAX_JSON_BYTES: 4096,      // decoded theme JSON
  PAYLOAD_VERSION: 1,
};
class ThemeLinkError extends Error { constructor(m){ super(m); this.name = "ThemeLinkError"; } }

/* --- url-safe base64 (strict) --- */
function b64urlEncodeBytes(bytes){
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecodeBytes(str){
  if (!/^[A-Za-z0-9_-]*$/.test(str)) throw new ThemeLinkError("Share link is malformed.");
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  let bin;
  try { bin = atob(b64); } catch { throw new ThemeLinkError("Share link is corrupted."); }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function drainStream(readable){
  const reader = readable.getReader();
  const chunks = []; let total = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); total += value.length;
    if (total > THEME_LINK.MAX_JSON_BYTES * 4) throw new ThemeLinkError("Shared theme is too large.");
  }
  const out = new Uint8Array(total); let o = 0;
  for (const c of chunks){ out.set(c, o); o += c.length; }
  return out;
}
async function gzip(bytes){
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter(); w.write(bytes); w.close();
  return drainStream(cs.readable);
}
async function gunzip(bytes){
  const ds = new DecompressionStream("deflate-raw");
  const w = ds.writable.getWriter(); w.write(bytes); w.close();
  return drainStream(ds.readable);
}

/* --- encode / decode --- */
async function encodeThemeLink(theme){
  const json = JSON.stringify(theme);
  let bytes = new TextEncoder().encode(json), marker = "r";
  if (typeof CompressionStream === "function"){
    try { bytes = await gzip(new TextEncoder().encode(json)); marker = "d"; } catch(_) { marker = "r"; bytes = new TextEncoder().encode(json); }
  }
  return marker + b64urlEncodeBytes(bytes);
}
async function decodeThemeLink(payload){
  if (typeof payload !== "string" || payload.length < 2) throw new ThemeLinkError("Empty share link.");
  if (payload.length > THEME_LINK.MAX_LINK_CHARS) throw new ThemeLinkError("This share link is too large to import.");
  const marker = payload[0];
  let bytes = b64urlDecodeBytes(payload.slice(1));
  if (marker === "d"){
    if (typeof DecompressionStream !== "function") throw new ThemeLinkError("This link needs a newer browser to open.");
    bytes = await gunzip(bytes);
  } else if (marker !== "r"){
    throw new ThemeLinkError("Unrecognised share link.");
  }
  if (bytes.length > THEME_LINK.MAX_JSON_BYTES) throw new ThemeLinkError("Shared theme is too large.");
  let obj;
  try { obj = JSON.parse(new TextDecoder().decode(bytes)); }
  catch { throw new ThemeLinkError("Share link is corrupted."); }
  return obj;
}

/* --- strict value validators --- */
const _BAD_SUBSTR = /<|>|url\s*\(|expression|javascript:|@import|\/\*|\*\/|\\|`|\{|\}|;|data:|vbscript:|&#|behaviou?r\s*:|-moz-binding/i;
function safeStr(s){ return typeof s === "string" && s.length <= 200 && !_BAD_SUBSTR.test(s); }
const _NAMED_COLORS = new Set(("transparent black white red green blue yellow orange purple pink cyan magenta gray grey " +
  "navy teal maroon olive lime aqua silver gold brown coral salmon khaki indigo violet crimson turquoise tomato orchid " +
  "plum slateblue steelblue skyblue royalblue midnightblue darkblue lightblue darkgreen lightgreen seagreen forestgreen " +
  "darkred firebrick darkorange goldenrod chocolate sienna tan beige ivory lavender whitesmoke gainsboro dimgray dimgrey " +
  "darkgray darkgrey lightgray lightgrey slategray slategrey").split(" "));
function isStrictColor(v){
  if (typeof v !== "string" || v.length > 40) return false;
  const s = v.trim().toLowerCase();
  if (/^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/.test(s)) return true;
  if (/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d{1,3}|\.\d{1,3}))?\s*\)$/.test(s)) return true;
  if (/^hsla?\(\s*\d{1,3}\s*,\s*\d{1,3}%\s*,\s*\d{1,3}%\s*(,\s*(0|1|0?\.\d{1,3}|\.\d{1,3}))?\s*\)$/.test(s)) return true;
  return _NAMED_COLORS.has(s);
}
function isStrictLength(v){
  return typeof v === "string" && /^(0|-?\d{1,3}(\.\d{1,2})?(px|rem|em|%))$/.test(v.trim());
}
function isStrictShadow(v){
  if (typeof v !== "string" || v.length > 140) return false;
  const L = "(?:-?(?:0|\\d{1,3}(?:\\.\\d{1,2})?)(?:px)?)";
  const A = "(?:0|1|0?\\.\\d{1,3}|\\.\\d{1,3})";
  const C = `(?:#[0-9a-fA-F]{3,8}|rgba?\\(\\s*\\d{1,3}\\s*,\\s*\\d{1,3}\\s*,\\s*\\d{1,3}\\s*(?:,\\s*${A})?\\s*\\)|hsla?\\(\\s*\\d{1,3}\\s*,\\s*\\d{1,3}%\\s*,\\s*\\d{1,3}%\\s*(?:,\\s*${A})?\\s*\\))`;
  const LAYER = `(?:inset\\s+)?${L}\\s+${L}(?:\\s+${L})?(?:\\s+${L})?(?:\\s+${C})?`;
  return new RegExp(`^\\s*${LAYER}(?:\\s*,\\s*${LAYER}){0,3}\\s*$`, "i").test(v);
}
function validTokenValue(key, v){
  if (typeof v !== "string" || !safeStr(v)) return false;
  if (key === "shadow") return isStrictShadow(v);
  if (key === "r-lg" || key === "r-md" || key === "r-sm") return isStrictLength(v);
  return isStrictColor(v);
}
const FONT_NAME_RE = /^[A-Za-z0-9][A-Za-z0-9 -]{0,39}$/;

/* --- the schema gate: obj (from a link, or a backup) -> {ok, theme} | {ok:false, error} --- */
function validateSharedTheme(obj){
  const R = (error) => ({ ok: false, error });
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return R("Not a theme.");
  const ALLOWED = ["v", "id", "name", "author", "scheme", "tokens", "font"];
  for (const k of Object.keys(obj)) if (!ALLOWED.includes(k)) return R(`Unexpected field "${k}".`);
  if (obj.v !== THEME_LINK.PAYLOAD_VERSION) return R("Unsupported theme version.");
  if (typeof obj.id !== "string" || !/^[a-z0-9-]{1,32}$/.test(obj.id)) return R("Bad theme id.");
  if (typeof obj.name !== "string" || obj.name.trim().length < 1 || obj.name.length > 40 || !safeStr(obj.name))
    return R("Bad theme name.");
  if (obj.author !== undefined && (typeof obj.author !== "string" || obj.author.length > 40 || !safeStr(obj.author)))
    return R("Bad author.");
  if (obj.scheme !== "light" && obj.scheme !== "dark") return R("Bad scheme.");
  if (!obj.tokens || typeof obj.tokens !== "object" || Array.isArray(obj.tokens)) return R("Missing palette.");
  const keys = Object.keys(obj.tokens);
  if (keys.length < 1 || keys.length > THEME_TOKEN_KEYS.length) return R("Bad palette size.");
  const tokens = {};
  for (const k of keys){
    if (!THEME_TOKEN_KEYS.includes(k)) return R(`Unknown colour "${k}".`);
    if (!validTokenValue(k, obj.tokens[k])) return R(`"${k}" is not a valid ${k === "shadow" ? "shadow" : k.startsWith("r-") ? "size" : "colour"}.`);
    tokens[k] = obj.tokens[k].trim();
  }
  let font;
  if (obj.font !== undefined && obj.font !== null){
    if (typeof obj.font !== "string" || !FONT_NAME_RE.test(obj.font)) return R("Bad font name.");
    font = obj.font;
  }
  return { ok: true, theme: {
    v: 1, id: obj.id, name: obj.name.trim(), scheme: obj.scheme, tokens,
    ...(obj.author ? { author: obj.author.trim() } : {}),
    ...(font ? { font } : {}),
  }};
}

/* --- build the payload for the CURRENT theme (built-in or user) --- */
function serializeThemeForShare(id){
  const t = THEME_REG[id]; if (!t) throw new ThemeLinkError("Unknown theme.");
  const full = t.tokens || {};
  const tokens = {};
  for (const k of THEME_TOKEN_KEYS) if (full[k] && validTokenValue(k, full[k])) tokens[k] = full[k];
  if (!Object.keys(tokens).length) throw new ThemeLinkError("This theme has no shareable palette.");
  const p = { v: 1, id: t.id, name: t.name, scheme: t.scheme === "light" ? "light" : "dark", tokens };
  if (t.fontFamily && FONT_NAME_RE.test(t.fontFamily)) p.font = t.fontFamily;
  return p;
}
function shareBaseUrl(){
  try { return location.origin + location.pathname; } catch { return "https://example.com/"; }
}
async function buildShareLink(id){
  const payload = serializeThemeForShare(id);
  const encoded = await encodeThemeLink(payload);
  if (encoded.length > THEME_LINK.MAX_LINK_CHARS) throw new ThemeLinkError("Theme is too complex to share as a link.");
  return { url: shareBaseUrl() + "#theme=" + encoded, encoded, payload };
}

/* --- import from a #theme= fragment (boot) --- */
let pendingImportTheme = null;
function themeFragment(){
  try {
    const m = /(?:^|[#&])theme=([^&]*)/.exec(location.hash || "");
    return m ? decodeURIComponent(m[1]) : null;
  } catch { return null; }
}
function clearThemeFragment(){
  try {
    let h = (location.hash || "").replace(/(^#|&)theme=[^&]*/, "$1").replace(/^#&/, "#").replace(/[#&]$/, "");
    if (h === "#") h = "";
    if (history && history.replaceState) history.replaceState(null, document.title, location.pathname + location.search + h);
    else location.hash = h;
  } catch { try { location.hash = ""; } catch(_) {} }
}
async function handleThemeLinkFragment(){
  const payload = themeFragment();
  if (!payload) return;
  clearThemeFragment();                       // strip it whatever happens
  let obj, err;
  try { obj = await decodeThemeLink(payload); }
  catch(e){ err = e; }
  let theme;
  if (!err){
    const res = validateSharedTheme(obj);
    if (!res.ok) err = new ThemeLinkError(res.error);
    else theme = res.theme;
  }
  if (err){
    setTimeout(() => toast("Theme link rejected: " + (err instanceof ThemeLinkError ? err.message : "invalid")), 700);
    return;                                    // app entirely untouched
  }
  pendingImportTheme = theme;
  setTimeout(() => openThemeImportPreview(theme), 450);
}

/* ---- URL parameters for iOS Shortcuts --------------------------------------
 * ?sms=<one or more bank messages>  — parse and open the REVIEW screen with the
 *   result pre-filled. Never auto-saves. An unrecognised message still lands on
 *   review as a needs-a-type entry. Multiple messages (blank-line separated, or
 *   run together the way real bank SMS are) all parse via SmsParser.parseBatch.
 * ?view=add  — open straight to the add-transaction keypad.
 * The params are stripped from the URL first, so a refresh never re-imports.
 * Oversized or malformed input is ignored without disturbing the app.
 * ------------------------------------------------------------------------- */
const URL_SMS_MAX = 4000;       // generous headroom: ~25 average bank SMS at once

function clearQueryParams(keys){
  try {
    const sp = new URLSearchParams(location.search || "");
    let hit = false;
    for (const k of keys) if (sp.has(k)){ sp.delete(k); hit = true; }
    if (!hit) return;
    const qs = sp.toString();
    const url = location.pathname + (qs ? "?" + qs : "") + (location.hash || "");
    if (history && history.replaceState) history.replaceState(null, document.title, url);
    else location.search = qs;
  } catch(_){}
}

async function handleUrlParams(){
  let sms = null, view = null;
  try {
    const sp = new URLSearchParams(location.search || "");   // decodes %XX and "+" for us
    sms = sp.get("sms");
    view = sp.get("view");
  } catch(_){}
  if (sms == null && view == null) return;
  clearQueryParams(["sms", "view"]);                         // strip first — a refresh must not re-import
  if (!(await DB.meta("onboarded", false))) return;          // don't stack modals over onboarding

  if (sms != null){
    if (sms.length > URL_SMS_MAX){
      setTimeout(() => toast("Import link too long — ignored"), 500);
    } else {
      let parsed = [];
      try { parsed = SmsParser.parseBatch(sms, parserCtx()); } catch(_){}
      if (!parsed.length && sms.trim()){                     // too short for the batch splitter — still review it
        try { const one = SmsParser.parseOne(sms.trim(), parserCtx()); if (one) parsed = [one]; } catch(_){}
      }
      if (parsed.length){
        openFull(smsHTML()); wireSMS();
        openReview(parsed, { anchor: "#smsReview", source: "sms" });
        setTimeout(() => { const el = FULL.querySelector("#smsReview"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" }); }, 60);
        return;                                              // an SMS import wins over ?view=add
      }
    }
  }

  if (view === "add"){
    draft = newDraft();
    openKeypad();
  }
}

    const n = b.dataset.onbEnv;
    onbState.envelopes = onbState.envelopes.includes(n) ? onbState.envelopes.filter(x=>x!==n) : [...onbState.envelopes, n];
    b.setAttribute("aria-pressed", String(onbState.envelopes.includes(n)));
  }));
  ONB.querySelectorAll("[data-onb-acc]").forEach(el => el.addEventListener("input", () => {
    const a = onbState.accounts[+el.dataset.onbAcc];
    if (a) a[el.dataset.f] = el.dataset.f === "last4" ? el.value.replace(/\D/g, "").slice(-4) : el.value;
  }));
  const accAdd = ONB.querySelector("#onbAccAdd");
  if (accAdd) accAdd.addEventListener("click", () => { onbState.accounts.push({ label:"Savings", last4:"" }); renderOnb(); });
  const g = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  ONB.querySelector("#onbNext").addEventListener("click", async () => {
    if (onbState.step === 1){ onbState.income = g("onbIncome"); onbState.salaryDay = g("onbSalaryDay"); }
    if (onbState.step === 3){ onbState.savePct = g("onbSavePct"); }
    if (onbState.step < ONB_STEPS.length - 1){ onbState.step++; renderOnb(); }
    else await finishOnb();
  });
  const back = ONB.querySelector("#onbBack"); if (back) back.addEventListener("click", () => { onbState.step--; renderOnb(); });
  const skip = ONB.querySelector("#onbSkip"); if (skip) skip.addEventListener("click", finishOnb);
}
async function finishOnb(){
  if (onbState.income) await DB.setMeta("monthlyIncome", U.toBaisa(onbState.income));
  if (onbState.salaryDay) await DB.setMeta("salaryDay", U.clamp(parseInt(onbState.salaryDay)||25,1,28));
  if (onbState.savePct) await DB.setMeta("savingsTargetPct", U.clamp(parseInt(onbState.savePct)||0,0,80));
  if (onbState.envelopes?.length) await DB.setMeta("preferredEnvelopes", onbState.envelopes);
  // accounts
  const accs = (onbState.accounts || []).filter(a => (a.label || "").trim());
  if (accs.length){
    for (const a of await DB.getAll("accounts")) await DB.del("accounts", a.id);
    let i = 0;
    for (const a of accs){
      await DB.put("accounts", { id:U.uid(), label:a.label.trim().slice(0,24),
        last4:(a.last4||"").replace(/\D/g,"").slice(-4), type: i>0?"savings":"current",
        isPrimary: i===0, openingBalance:0 });
      i++;
    }
  }
  await DB.setMeta("onboarded", true);
  await refresh();
  ONB.hidden = true; ONB.style.display = "none"; ONB.innerHTML = "";
  render();
  afterInteraction();
}

/* ---- recurring rollover (auto-log pending when due) ---- */
function advanceDue(ts, cadence, intervalDays){
  const d = new Date(ts);
  if (cadence === "weekly") d.setDate(d.getDate() + 7);
  else if (cadence === "yearly") d.setFullYear(d.getFullYear() + 1);
  else if (cadence === "custom" && intervalDays) d.setDate(d.getDate() + (intervalDays || 30));
  else d.setMonth(d.getMonth() + 1);
  d.setHours(12, 0, 0, 0);
  return d.getTime();
}
async function rollRecurring(){
  const today = U.todayTs();
  let changed = false;
  for (const r of S.recurring){
    if (r.active === false) continue;
    let guard = 0;
    while (r.nextDue <= today && guard++ < 36){
      const already = S.pending.some(p => p.recurringId === r.id && Math.abs(p.ts - r.nextDue) < 43200000);
      if (!already){
        await DB.put("transactions", {
          id:U.uid(), ts:r.nextDue, month:U.monthKey(new Date(r.nextDue)), amount:r.amount,
          type: r.type === "income" ? "income" : "expense", category:r.category,
          note:r.name, source:"recurring", recurringId:r.id, pending:true,
        });
      }
      r.nextDue = advanceDue(r.nextDue, r.cadence, r.intervalDays);
      changed = true;
    }
    if (changed) await DB.put("recurring", r);
  }
  if (changed) await refresh();
}

/* ============ [G] THEME MUSIC + GAMIFICATION MODULE ============== *
 * Both are generic theme-system features driven by fields in the active
 * theme's registry entry (see THEME-SPEC.md "music" / "module"). Monarch is
 * the only built-in that declares them, so in practice this is Monarch-only —
 * and every bit of UI below is gated so it vanishes under any other theme.
 * --------------------------------------------------------------------------- */
function prefersReducedMotion(){
  try { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(_) { return false; }
}

/* ---- theme music ---------------------------------------------------------
 * A theme can declare music: { src, startAt, loop }. But the built-in `src`
 * often isn't shipped (Monarch's track is copyrighted, so it's gitignored and
 * 404s in production). So the real source of truth is a file the user picks in
 * Settings, stored as a Blob in IndexedDB and played via URL.createObjectURL.
 * Resolution order: local file  ->  theme's declared src  ->  hide the control.
 * startAt / loop always come from the theme. Tap-to-play only, never autoplay.
 * ----------------------------------------------------------------------- */
const MUSIC_FILE_MAX = 25 * 1024 * 1024;   // 25 MB — one song, safe for mobile IndexedDB

const themeMusic = {
  el: null, wired: false, missing: false, started: false, seekPending: null, probed: "", objUrl: null,
  localBlob: null,          // the File/Blob, held in memory so first-play needs NO await before .play() (iOS)
  decodeOk: null,           // true | false | null(unknown) — from a silent metadata probe
  spec(){ return (THEME_REG[currentThemeId()] || {}).music || null; },
  hasLocal(){ return !!(S.settings && S.settings.musicFileName) && !DB.fallback; },
  get localBroken(){ return this.hasLocal() && this.decodeOk === false; },
  async probe(){                                          // cheap check so a missing declared src hides the control up front
    const sp = this.spec();
    if (!sp || this.started) return;
    if (this.hasLocal() && this.decodeOk !== false){ this.missing = false; this.render(); return; }
    // no local file, OR a broken one -> we depend on the theme's declared src; is it actually there?
    if (this.probed === sp.src) return;
    this.probed = sp.src;
    try {
      const res = await fetch(sp.src, { method: "GET", headers: { Range: "bytes=0-0" }, cache: "no-store" });
      if (!res.ok && res.status !== 206) throw 0;
      this.missing = false;
    } catch(_) {
      this.missing = true;
    }
    this.render();
  },
  _revoke(){ if (this.objUrl){ try { URL.revokeObjectURL(this.objUrl); } catch(_){} this.objUrl = null; } },
  _resetPlayback(){
    try { this.el && this.el.pause(); } catch(_){}
    try { if (this.el){ this.el.removeAttribute("src"); this.el.load(); } } catch(_){}
    this._revoke();
    this.started = false; this.seekPending = null;
  },
  _srcNow(){                                              // SYNCHRONOUS: a good local blob wins, else the theme's declared src
    if (this.localBlob && this.decodeOk !== false){
      try { this._revoke(); this.objUrl = URL.createObjectURL(this.localBlob); return this.objUrl; } catch(_){}
    }
    const sp = this.spec();
    return sp ? sp.src : null;
  },
  /* silent metadata probe: does the browser's audio engine accept this file's container/codec? no sound, no gesture */
  _decodeCheck(blob){
    return new Promise((resolve) => {
      let a = new Audio(), url = "", done = false;
      const finish = (v) => { if (done) return; done = true; clearTimeout(to);
        try { a.removeAttribute("src"); a.load(); } catch(_){}
        if (url) try { URL.revokeObjectURL(url); } catch(_){}
        a = null; resolve(v); };
      const to = setTimeout(() => finish(null), 6000);   // couldn't confirm either way
      try {
        a.preload = "metadata"; a.muted = true;
        a.addEventListener("loadedmetadata", () => finish(true));
        a.addEventListener("canplay", () => finish(true));
        a.addEventListener("error", () => finish(false));
        url = URL.createObjectURL(blob);
        a.src = url; a.load();
      } catch(_) { finish(false); }
    });
  },
  async setLocalFile(file){
    if (DB.fallback){ toast("This browser can't store a local music file (no IndexedDB)"); return false; }
    if (!file){ toast("No file came back from the picker — try a different file or re-save it as MP3"); return false; }
    if (file.size > MUSIC_FILE_MAX){ toast("Audio file too large (max 25 MB)"); return false; }
    // NO MIME-string gate — a valid MP3 from AirDrop/email often has an empty or odd type. Let the audio engine decide.
    try {
      await DB.setMeta("musicFile", file);
      await DB.setMeta("musicFileName", file.name || "audio file");
      await DB.setMeta("musicFileSize", file.size || 0);
      await DB.setMeta("musicFileType", file.type || "");
    } catch(e){ toast("Couldn't save that file to this device"); return false; }
    S.settings.musicFileName = file.name || "audio file";
    S.settings.musicFileSize = file.size || 0;
    S.settings.musicFileType = file.type || "";
    this.localBlob = file;
    this.missing = false; this.probed = ""; this.decodeOk = null;
    const wasPlaying = this.playing();
    this._resetPlayback();
    this.render();
    // report the REAL outcome, not a MIME guess
    this.decodeOk = await this._decodeCheck(file);
    if (this.decodeOk === false){ this.probed = ""; await this.probe(); }   // learn if the declared-src fallback works
    this.render();
    if (this.decodeOk === false){
      toast(`Saved, but your browser can't decode this ${musicExt(file)} file. Try MP3 or M4A/AAC.`);
    } else {
      toast(`Music saved: ${file.name || "audio file"} (${fmtBytes(file.size||0)}). Tap Play.`);
      if (wasPlaying) this.toggle();
    }
    return this.decodeOk !== false;
  },
  async removeLocalFile(){
    try { await DB.setMeta("musicFile", null); await DB.setMeta("musicFileName", null);
      await DB.setMeta("musicFileSize", 0); await DB.setMeta("musicFileType", ""); } catch(_){}
    S.settings.musicFileName = null; S.settings.musicFileSize = 0; S.settings.musicFileType = "";
    this.localBlob = null; this.decodeOk = null;
    this._resetPlayback();
    this.missing = false; this.probed = "";
    this.render();
    await this.probe();                                   // fall back to the declared src (may 404 -> hidden)
    toast("Music file removed");
  },
  _applyStart(){                                          // seek to startAt once the media can honour it
    if (this.seekPending == null || !this.el) return;
    const want = this.seekPending;
    if (!want){ this.seekPending = null; return; }
    if (this.el.readyState < 1) return;                   // no metadata yet — wait for loadedmetadata
    try {
      if (this.el.currentTime < want - 0.5) this.el.currentTime = want;
      if (Math.abs(this.el.currentTime - want) < 1.5) this.seekPending = null;
    } catch(_){}
  },
  async attach(){
    this.el = document.getElementById("themeAudio");
    if (!this.el) return;
    this.el.volume = U.clamp(Number(S.settings.musicVolume ?? 0.5), 0, 1);
    if (!this.wired){
      this.wired = true;
      this.el.addEventListener("loadedmetadata", () => this._applyStart());
      this.el.addEventListener("canplay", () => this._applyStart());
      // proactive seamless loop: jump back to startAt just before the true end
      this.el.addEventListener("timeupdate", () => {
        const sp = this.spec();
        if (!sp || sp.loop === false) return;
        const d = this.el.duration;
        if (d && isFinite(d) && this.el.currentTime >= d - 0.25){
          try { this.el.currentTime = sp.startAt || 0; } catch(_){}
        }
      });
      this.el.addEventListener("ended", () => {           // fallback if timeupdate missed the end
        const sp = this.spec();
        if (!sp || sp.loop === false){ this.render(); return; }
        try { this.el.currentTime = sp.startAt || 0; this.el.play().catch(()=>{}); } catch(_){}
      });
      this.el.addEventListener("error", () => {
        if (!this.el.getAttribute("src")) return;
        if (this.hasLocal()){ this.decodeOk = false; this._resetPlayback(); toast("That audio file wouldn't play in this browser"); }
        else { this.missing = true; this.started = false; }
        this.render();
      });
    }
    this.render();
    this.probe();
    // eagerly load the stored Blob so the FIRST tap-to-play has no await before .play() (iOS gesture rule)
    if (this.hasLocal() && !this.localBlob){
      try {
        const f = await DB.meta("musicFile", null);
        if (f && (f.size == null || f.size > 0)){
          this.localBlob = f;
          this.decodeOk = await this._decodeCheck(f);
          this.render();
        }
      } catch(_){}
    }
  },
  playing(){ return !!(this.el && this.started && !this.el.paused); },
  playable(){
    if (this.hasLocal() && this.decodeOk !== false) return true;   // a good local file
    return !!this.spec() && !this.missing;                         // else the theme's declared src, if reachable
  },
  toggle(){                                               // NOT async: nothing may await before .play() in the tap
    const sp = this.spec();
    if (!sp || !this.el || !this.playable()) return;
    if (this.playing()){ this.el.pause(); this.render(); return; }
    if (!this.started){
      const url = this._srcNow();                         // synchronous — blob URL or declared src
      if (!url){ this.render(); return; }
      this.el.src = url;
      this.started = true;
    }
    this.seekPending = sp.startAt || 0;
    this._applyStart();
    const t0 = this.el.currentTime || 0;
    const usedLocalBlob = !!this.objUrl && this.el.src === this.objUrl;
    let p;
    try { p = this.el.play(); } catch(err){ p = Promise.reject(err); }
    Promise.resolve(p).then(() => {
      this._applyStart();
      this.render();
      // iOS "silent switch": play() succeeded but no sound + the clock never advanced -> ringer switch is muted
      setTimeout(() => {
        if (this.el && !this.el.paused && (this.el.currentTime - t0) < 0.2){
          toast("Playing — but if you hear nothing, flip your iPhone's ring/silent switch on.");
        }
      }, 1800);
    }).catch(() => {
      if (usedLocalBlob){ this.decodeOk = false; toast("That audio file wouldn't play — try MP3 or M4A/AAC"); }
      else this.missing = true;                           // declared src 404 / autoplay-blocked
      this._resetPlayback();
      this.probed = ""; this.probe();                     // re-evaluate what's still available
      this.render();
    });
    this.render();
  },
  setVolume(v){
    v = U.clamp(Number(v), 0, 1);
    if (this.el) this.el.volume = v;
    S.settings.musicVolume = v;
    DB.setMeta("musicVolume", v);
  },
  onThemeChange(){
    if (this.spec()) { this.render(); this.probe(); return; }
    this._resetPlayback();
    this.missing = false; this.probed = "";
    this.render();
  },
  render(){                                               // reflect state onto any live controls
    const show = this.playable();
    const btn = document.getElementById("musicToggle");
    if (btn){
      btn.hidden = !show;
      btn.innerHTML = this.playing() ? svgIcon("musicPause") : svgIcon("music");
      btn.setAttribute("aria-label", this.playing() ? "Pause theme music" : "Play theme music");
      btn.classList.toggle("playing", this.playing());
    }
    const sBtn = document.getElementById("setMusicToggle");
    if (sBtn) sBtn.textContent = this.playing() ? "Pause" : "Play";
    const playRow = document.getElementById("monarchMusicPlay");
    if (playRow) playRow.hidden = !show;
  },
};
function musicExt(file){
  const n = (file && file.name || "").toLowerCase();
  const m = /\.([a-z0-9]+)$/.exec(n);
  if (m) return m[1].toUpperCase();
  const t = (file && file.type || "").split("/")[1];
  return t ? t.toUpperCase() : "audio";
}
/* Settings → Troubleshooting one-liner: does a Blob exist, how big, and does the audio engine accept it? */
function musicDiag(){
  const s = S.settings;
  if (!s.musicFileName) return "Theme music: no local file · " + (themeMusic.playable() ? "using the theme's built-in track" : "no source (control hidden)");
  const state = themeMusic.decodeOk === false ? "audio element: CANNOT decode"
    : themeMusic.decodeOk === true ? "audio element: reports playable"
    : "audio element: not yet checked";
  return `Theme music: Blob present · ${fmtBytes(s.musicFileSize || 0)}${s.musicFileType ? " · " + esc(s.musicFileType) : ""} · ${state}`;
}

/* ---- gamification: only "live" when the active theme opts in via module:"gamification" ---- */
function gameActive(){ return (THEME_REG[currentThemeId()] || {}).module === "gamification"; }

/* level curve: reaching level N costs 50*N*(N-1) cumulative XP (L2=100, L3=300, L4=600, L5=1000…) */
function xpForLevel(n){ return 50 * n * (n - 1); }
function levelFor(xp){
  xp = Math.max(0, Math.floor(xp || 0));
  let level = 1;
  while (xpForLevel(level + 1) <= xp) level++;
  const base = xpForLevel(level), next = xpForLevel(level + 1);
  const span = next - base, into = xp - base;
  return { level, into, span, pct: span ? Math.round(into / span * 100) : 100, next };
}
async function awardXp(n){
  if (!gameActive() || !n) return;
  const g = S.settings.game || (S.settings.game = { xp: 0, quests: { ymd: "", done: [] } });
  const before = levelFor(g.xp).level;
  g.xp = Math.max(0, Math.floor((g.xp || 0) + n));
  await DB.setMeta("game", g);
  const after = levelFor(g.xp).level;
  if (after > before) toast("LEVEL " + after);
}

/* Every quest keys off a condition it can actually verify TODAY (see questCtx).
 * `avail(c)` gates quests that need a configured allowance: if it returns false the
 * quest is UNAVAILABLE — never auto-completed, never awards XP, shown with `hint`. */
const QUEST_POOL = [
  { id: "log",     label: "Log a purchase today",          xp: 15, check: (c) => c.expensesToday >= 1 },
  { id: "under",   label: "Spend within today's allowance",xp: 15,
    avail: (c) => c.allowanceConfigured, hint: "Set your monthly plan to unlock",
    check: (c) => c.expensesToday >= 1 && c.spentToday <= c.allowanceToday + 1 },
  { id: "streak",  label: "Keep your no-overspend streak", xp: 15,
    avail: (c) => c.allowanceConfigured, hint: "Set your monthly plan to unlock",
    check: (c) => c.spentToday <= c.allowanceToday + 1 },
  { id: "fund",    label: "Fund a savings goal",           xp: 15, check: (c) => c.goalFundedToday },
  { id: "note",    label: "Add a note to a transaction",   xp: 15, check: (c) => c.notedToday },
  { id: "nospend", label: "Survive a no-spend day",        xp: 15, check: (c) => c.dayIsOver && c.expensesToday === 0 },
];
/* deterministic per-day pick of 3 (small LCG seeded by the date string) */
function todaysQuests(ymd = U.ymd()){
  let seed = 0; for (let i = 0; i < ymd.length; i++) seed = (seed * 31 + ymd.charCodeAt(i)) >>> 0;
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--){
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const j = seed % (i + 1);
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3);
}
function questCtx(){
  const today = U.ymd();
  const now = new Date();
  const todayTx = S.tx.filter(t => U.ymd(new Date(t.ts)) === today);
  const spendToday = todayTx.filter(t => F.isSpend(t));
  const al = F.dailyAllowance(now);
  return {
    expensesToday: spendToday.length,
    spentToday: U.sum(spendToday, t => t.amount),
    allowanceConfigured: al.configured,                 // is there a real monthly plan / income?
    allowanceToday: al.today,                           // today's actual allowance figure (post-correction, floored)
    goalFundedToday: S.tx.some(t => t.type === "transfer" && U.ymd(new Date(t.ts)) === today),
    notedToday: todayTx.some(t => (t.note || "").trim().length > 0),
    dayIsOver: now.getHours() >= 21,
  };
}
async function syncQuests(){
  if (!gameActive()) return;
  const g = S.settings.game || (S.settings.game = { xp: 0, quests: { ymd: "", done: [] } });
  const today = U.ymd();
  if (!g.quests || g.quests.ymd !== today) g.quests = { ymd: today, done: [] };
  const ctx = questCtx();
  let gained = 0;
  for (const q of todaysQuests(today)){
    if (g.quests.done.includes(q.id)) continue;
    if (q.avail && !q.avail(ctx)) continue;               // unmeasurable today — no auto-complete, no XP
    let ok = false; try { ok = !!q.check(ctx); } catch(_){}
    if (ok){ g.quests.done.push(q.id); gained += q.xp; toast("QUEST · " + q.label); }
  }
  await DB.setMeta("game", g);
  if (gained){ await awardXp(gained); if (currentTab === "home") render(); }
}

function gamePanelHTML(){
  const g = S.settings.game || { xp: 0, quests: { ymd: "", done: [] } };
  const lv = levelFor(g.xp);
  const done = (g.quests && g.quests.ymd === U.ymd()) ? (g.quests.done || []) : [];
  const streak = S.settings.streak || 0;
  const ctx = questCtx();
  const quests = todaysQuests().map(q => {
    const d = done.includes(q.id);
    if (!d && q.avail && !q.avail(ctx)){
      return `<div class="quest unavail"><span class="q-box">${svgIcon("lock")}</span>
        <span class="q-label">${esc(q.label)}<span class="q-hint">${esc(q.hint || "Not available yet")}</span></span></div>`;
    }
    return `<div class="quest${d ? " done" : ""}"><span class="q-box">${d ? svgIcon("check") : svgIcon("diamond")}</span>
      <span class="q-label">${esc(q.label)}</span><span class="q-xp">+${q.xp}</span></div>`;
  }).join("");
  return `
  <div class="card game-panel">
    <div class="row between" style="align-items:flex-start">
      <div>
        <div class="gp-lv mono">LV <span data-count="${lv.level}" data-count-fmt="int">${lv.level}</span></div>
        <div class="tiny faint">Monarch · daily quests</div>
      </div>
      <div class="gp-streak mono" title="no-overspend streak">${svgIcon("flame")} ${streak}<span class="tiny faint"> day${streak===1?"":"s"}</span></div>
    </div>
    <div class="xpbar"><i style="width:${lv.pct}%"></i></div>
    <div class="tiny faint mono" style="margin-top:4px">
      <span data-count="${lv.into}" data-count-fmt="int">${lv.into}</span> / ${lv.span} XP to LV ${lv.level+1}
    </div>
    <div class="quests">${quests}</div>
  </div>`;
}

/* full-screen "QUEST COMPLETE" when a savings goal is funded (gamification themes only) */
let _qcTimer;
function showQuestComplete(goal){
  if (!gameActive()) return;
  const el = document.getElementById("questComplete");
  if (!el) return;
  el.innerHTML = `
    <div class="qc-inner">
      <div class="qc-kicker">SYSTEM · NOTIFICATION</div>
      <div class="qc-title">QUEST COMPLETE</div>
      <div class="qc-sub">${esc((goal && goal.name) || "Savings goal")} — funded</div>
      <div class="qc-xp mono">+<span data-count="100" data-count-fmt="int">100</span> XP</div>
      <div class="qc-hint tiny faint">tap to dismiss</div>
    </div>`;
  el.hidden = false;
  animateCounts(el);
  const close = () => { clearTimeout(_qcTimer); el.hidden = true; el.innerHTML = ""; el.removeEventListener("click", close); afterInteraction(); };
  el.addEventListener("click", close);
  _qcTimer = setTimeout(close, prefersReducedMotion() ? 2200 : 4200);
}

/* ---- count-up: a Monarch "System readout" flourish on numeric values ---- */
function countUp(el, to, fmt){
  const dur = 620, t0 = performance.now(), from = 0;
  const fmtVal = (v) => fmt === "money" ? U.fmt(Math.round(v)) : String(Math.round(v));
  if (prefersReducedMotion()){ el.textContent = fmtVal(to); return; }
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);                    // easeOutCubic
    el.textContent = fmtVal(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = fmtVal(to);
  };
  requestAnimationFrame(step);
}
function animateCounts(root){
  if (currentThemeId() !== "monarch") return;             // the flourish is part of the Monarch feel
  const scope = root || document;
  scope.querySelectorAll("[data-count]").forEach(el => {
    const to = parseFloat(el.getAttribute("data-count"));
    if (!isFinite(to)) return;
    countUp(el, to, el.getAttribute("data-count-fmt") || "int");
  });
}

/* ---- [J] BOOT --------------------------------------------------- */
async function boot(){
  await DB.open();
  await seedIfNeeded();
  await refresh();
  await handleThemeLinkFragment();        // may queue an import preview; never auto-applies
  resolveThemeOnBoot();
  themeMusic.attach();                    // wires the <audio>; never autoplays
  startScheduler();
  await rollRecurring();
  window.__rialReady = true;
  go("home");
  handleUrlParams();                      // ?sms= / ?view=add from an iOS Shortcut

  if (!(await DB.meta("onboarded", false))) renderOnb();

  // backup nag
  const lb = S.settings.lastBackup ? Date.parse(S.settings.lastBackup) : 0;
  if (Date.now() - lb > 14*86400000){
    setTimeout(() => toast("Backup is " + (lb ? "overdue" : "not set") + " — export from Settings"), 1200);
  }

  // Monthly Wrapped — auto-open in the first 3 days of a new month, once
  const seen = await DB.meta("wrappedSeen", null);
  const pm = prevMonthKey();
  if (U.dayOfMonth() <= 3 && seen !== pm && F.monthTx(pm).length && (await DB.meta("onboarded", false))){
    setTimeout(() => openWrapped(pm), 600);
  }

  // Salary-day "split your salary" nudge
  const lastSplit = await DB.meta("lastSplitMonth", null);
  if (U.dayOfMonth() >= S.settings.salaryDay && lastSplit !== U.monthKey() && !F.planFor(U.monthKey())){
    setTimeout(() => toast("Salary day — open Plan to split it"), 2000);
  }

  updateBadge();

  if ("serviceWorker" in navigator){
    try {
      const hadControllerAtStart = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      // Reload once ONLY when a NEW worker replaces an existing one (a real update),
      // never on the very first install — so first visit doesn't flash-reload.
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshed || !hadControllerAtStart) return;
        refreshed = true; location.reload();
      });
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage({ type:"SKIP_WAITING" });
        });
      });
    } catch(e){ console.warn("SW reg failed (app still works)", e); }
  }
}
async function updateBadge(){
  try {
    if (!("setAppBadge" in navigator)) return;
    const n = notifCount();
    if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){
    refresh().then(() => { updateBadge(); evaluateSchedule(); flushPendingThemeSwitch(); if (currentTab) render(); });
  }
});
// a #theme= link pasted into the already-open app is handled too (still shows the preview, never auto-applies)
window.addEventListener("hashchange", () => { if (themeFragment() && !pendingImportTheme) handleThemeLinkFragment(); });

boot().catch((err) => {
  console.error("boot failed", err);
  if (window.__rialCrash) window.__rialCrash("boot() failed: " + (err && err.message || err), err && err.stack || "");
});
</script>
