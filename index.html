<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#0b0d10" id="metaTheme" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rial" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="shortcut icon" href="icon-192.png" />
<title>Rial</title>
<style>
/* ============================================================================
   RIAL — personal finance PWA · single file
   SECTIONS:  [1] theme tokens  [2] base/reset  [3] layout/nav  [4] components
              [5] screens  [6] keypad  [7] onboarding  [8] animations
   ========================================================================== */

/* ---- [1] THEME TOKENS ---------------------------------------------------- */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --tap: 44px;
  --spring: cubic-bezier(.22,1.2,.36,1);
}
/* Midnight (default dark) */
:root, :root[data-theme="midnight"]{
  --bg:#0b0d10; --bg-elev:#14171c; --bg-elev-2:#1c2027;
  --line:#262b33; --text:#f4f6f8; --text-dim:#9aa4b0; --text-faint:#5f6773;
  --accent:#4f8cff; --accent-ink:#ffffff;
  --pos:#3ddc91; --neg:#ff6b6b; --warn:#ffc266;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="paper"]{
  --bg:#f6f7f9; --bg-elev:#ffffff; --bg-elev-2:#f0f2f5;
  --line:#e3e6ea; --text:#12151a; --text-dim:#5c6570; --text-faint:#98a1ac;
  --accent:#2f6bff; --accent-ink:#ffffff;
  --pos:#12a05a; --neg:#d64545; --warn:#b7791f;
  --shadow: 0 8px 24px rgba(20,30,50,.08);
}
:root[data-theme="desert"]{
  --bg:#1c1610; --bg-elev:#26201a; --bg-elev-2:#312a22;
  --line:#3d3529; --text:#f7efe3; --text-dim:#c3b299; --text-faint:#8a7a63;
  --accent:#e0a44c; --accent-ink:#221a10;
  --pos:#8fbf6b; --neg:#e07a5f; --warn:#e6c35c;
  --shadow: 0 8px 30px rgba(0,0,0,.4);
}
:root[data-theme="depth"]{
  --bg:#070f1c; --bg-elev:#0e1a2e; --bg-elev-2:#152540;
  --line:#1e3355; --text:#eaf1fb; --text-dim:#93a7c4; --text-faint:#5b7091;
  --accent:#5bd6ff; --accent-ink:#04121f;
  --pos:#4fe0b0; --neg:#ff7a8a; --warn:#ffd06b;
  --shadow: 0 10px 34px rgba(0,0,0,.5);
}

/* ---- [2] BASE / RESET -------------------------------------------------- */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none; overflow:hidden;
  font-size:16px; line-height:1.4;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
h1,h2,h3,h4,p{ margin:0; }
.mono{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
::selection{ background:var(--accent); color:var(--accent-ink); }

/* ---- [3] LAYOUT / NAV ------------------------------------------------- */
#app{ position:fixed; inset:0; display:flex; flex-direction:column; }
#view{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding: calc(var(--sat) + 8px) 16px calc(96px + var(--sab)) 16px;
}
.screen{ animation: fade .18s ease; }
.pagehead{ display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 18px; }
.pagehead h1{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
.pagehead .sub{ color:var(--text-dim); font-size:13px; }

nav#tabs{
  position:absolute; left:0; right:0; bottom:0;
  padding: 8px 14px calc(8px + var(--sab));
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top:1px solid var(--line);
  display:grid; grid-template-columns: repeat(5,1fr); align-items:center;
}
nav#tabs button{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0; min-height:var(--tap); color:var(--text-faint);
  font-size:10px; font-weight:600; letter-spacing:.02em;
  transition: color .15s;
}
nav#tabs button .ic{ font-size:20px; line-height:1; }
nav#tabs button[aria-current="true"]{ color:var(--accent); }
nav#tabs .addslot{ position:relative; }
#addBtn{
  position:absolute; left:50%; top:-26px; transform:translateX(-50%);
  width:58px; height:58px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-size:30px; font-weight:400;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: transform .2s var(--spring);
}
#addBtn:active{ transform:translateX(-50%) scale(.9); }

/* ---- [4] COMPONENTS ------------------------------------------------- */
.card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; margin-bottom:14px; }
.card.tight{ padding:12px 14px; }
.row{ display:flex; align-items:center; gap:12px; }
.row.between{ justify-content:space-between; }
.muted{ color:var(--text-dim); }
.faint{ color:var(--text-faint); }
.tiny{ font-size:12px; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--bg-elev-2); font-size:12px; font-weight:600; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:0 18px; border-radius:var(--r-md);
  background:var(--bg-elev-2); font-weight:650; font-size:15px;
  border:1px solid var(--line); transition: transform .12s var(--spring), opacity .12s;
}
.btn:active{ transform:scale(.96); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--neg); }
.btn.block{ width:100%; }
.btn.sm{ min-height:36px; font-size:13px; padding:0 12px; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:12px; font-weight:600; color:var(--text-dim); letter-spacing:.02em; }
.field input, .field select, .field textarea{
  background:var(--bg-elev-2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:13px 14px; outline:none; min-height:var(--tap);
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
.seg{ display:flex; background:var(--bg-elev-2); border-radius:var(--r-md); padding:4px; gap:4px; }
.seg button{ flex:1; min-height:38px; border-radius:10px; font-weight:650; font-size:14px; color:var(--text-dim); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.divider{ height:1px; background:var(--line); margin:14px 0; }
.chip{ padding:8px 12px; border-radius:999px; background:var(--bg-elev-2); border:1px solid var(--line); font-size:13px; font-weight:600; white-space:nowrap; }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.scroll-x{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.scroll-x::-webkit-scrollbar{ display:none; }
.progress{ height:8px; border-radius:999px; background:var(--bg-elev-2); overflow:hidden; }
.progress > i{ display:block; height:100%; background:var(--accent); border-radius:999px; transform-origin:left; }
.badge-dot{ position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--neg); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:center; }

.sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
.sheet-scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41;
  background:var(--bg-elev); border-radius:22px 22px 0 0;
  border:1px solid var(--line); border-bottom:0;
  padding:10px 16px calc(20px + var(--sab));
  transform:translateY(102%); transition: transform .28s var(--spring);
  max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.sheet.open{ transform:translateY(0); }
.sheet .grabber{ width:38px; height:4px; border-radius:999px; background:var(--line); margin:2px auto 12px; }
.sheet h2{ font-size:19px; font-weight:700; margin-bottom:14px; }
.fullmodal{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  padding: calc(var(--sat) + 10px) 18px calc(20px + var(--sab));
  overflow-y:auto; transform:translateY(100%); transition:transform .3s var(--spring);
}
.fullmodal.open{ transform:translateY(0); }

.tx-day{ margin-bottom:6px; }
.tx-day .dhead{ display:flex; justify-content:space-between; padding:16px 2px 6px; font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.tx{ display:flex; align-items:center; gap:12px; padding:11px 4px; position:relative; }
.tx .ic{ width:38px; height:38px; border-radius:11px; background:var(--bg-elev-2); display:grid; place-items:center; font-size:18px; flex:none; }
.tx .mid{ flex:1; min-width:0; }
.tx .mid .t1{ font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx .mid .t2{ font-size:12px; color:var(--text-faint); }
.tx .amt{ font-weight:700; font-size:15px; }
.tx .amt.pos{ color:var(--pos); }

.hero{ text-align:center; padding:26px 10px 20px; }
.hero .label{ font-size:13px; font-weight:600; color:var(--text-dim); letter-spacing:.03em; }
.hero .big{ font-size:52px; font-weight:750; letter-spacing:-.03em; margin:6px 0 2px; }
.hero .big .cur{ font-size:20px; font-weight:650; color:var(--text-dim); vertical-align:middle; margin-right:6px; }
.hero .note{ font-size:13px; color:var(--text-faint); }

.stat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; text-align:center; }
.stat3 .s .v{ font-weight:700; font-size:17px; }
.stat3 .s .k{ font-size:11px; color:var(--text-faint); margin-top:2px; }

.bars .b{ margin:10px 0; }
.bars .b .lab{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
.bars .b .track{ height:10px; border-radius:999px; background:var(--bg-elev-2); overflow:hidden; }
.bars .b .track > i{ display:block; height:100%; border-radius:999px; background:var(--accent); }
.bars .b.prev .track > i{ background:var(--text-faint); }

.empty{ text-align:center; padding:44px 20px; color:var(--text-faint); }
.empty .e-ic{ font-size:38px; }
.empty p{ margin-top:8px; font-size:14px; }

/* ---- [6] KEYPAD ---------------------------------------------------- */
#keypad .amountline{ text-align:center; padding:10px 0 6px; }
#keypad .amountline .val{ font-size:44px; font-weight:750; letter-spacing:-.02em; }
#keypad .amountline .cur{ font-size:16px; color:var(--text-dim); margin-right:6px; }
.keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
.keys button{ min-height:56px; border-radius:var(--r-md); background:var(--bg-elev-2); font-size:22px; font-weight:650; transition:transform .08s, background .1s; }
.keys button:active{ transform:scale(.94); background:var(--line); }

/* ---- [7] ONBOARDING --------------------------------------------------- */
#onb{ position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  padding: calc(var(--sat) + 20px) 22px calc(24px + var(--sab)); }
/* the `hidden` attribute must win over the `display:flex` above (id selector) */
[hidden]{ display:none !important; }
#onb .step{ flex:1; display:flex; flex-direction:column; justify-content:center; animation:fade .2s; }
#onb h2{ font-size:24px; font-weight:750; letter-spacing:-.02em; margin-bottom:6px; }
#onb p.lead{ color:var(--text-dim); margin-bottom:22px; }
#onb .dots{ display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
#onb .dots i{ width:7px; height:7px; border-radius:50%; background:var(--line); }
#onb .dots i.on{ background:var(--accent); }

/* ---- [8] ANIMATIONS ------------------------------------------------- */
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
@keyframes pop{ 0%{transform:scale(.8); opacity:0;} 60%{transform:scale(1.05);} 100%{transform:scale(1); opacity:1;} }
@keyframes grow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
.pop{ animation:pop .3s var(--spring); }
.spark{ display:block; width:100%; height:44px; }
.toast{
  position:fixed; left:50%; bottom:calc(110px + var(--sab)); transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px;
  font-size:13px; font-weight:650; opacity:0; transition:all .25s var(--spring); z-index:70; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* range sliders (salary split) */
input[type="range"].rng{
  -webkit-appearance:none; appearance:none; height:28px; background:transparent; margin-top:6px;
}
input[type="range"].rng::-webkit-slider-runnable-track{ height:6px; border-radius:999px; background:var(--bg-elev-2); }
input[type="range"].rng::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--accent); border:3px solid var(--bg-elev); margin-top:-10px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--accent); }
details summary{ cursor:pointer; }
details pre{ background:var(--bg-elev-2); padding:10px; border-radius:8px; overflow-x:auto; max-height:200px; }
textarea{ font-family:var(--font); resize:vertical; }
img{ max-width:100%; }

/* theme-schedule crossfade overlay (transform/opacity only) */
#themeFade{
  position:fixed; inset:0; z-index:90; pointer-events:none;
  opacity:0; background:#0b0d10; will-change:opacity;
}
/* schedule editor bits */
.sched-win{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center; margin:10px 0; }
.sched-win > select{ grid-column:1 / -1; }
.sched-win input[type="time"], .sched-win select{ min-height:38px; padding:6px 8px; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:8px; width:100%; }
.sched-win button{ min-height:38px; }
.sched-note{ display:flex; gap:8px; align-items:center; background:var(--bg-elev-2); border:1px solid var(--warn); border-radius:var(--r-md); padding:10px 12px; margin-top:10px; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <main id="view"><!-- screens render here --></main>
  <nav id="tabs">
    <button data-tab="home"><span class="ic">◎</span>Home</button>
    <button data-tab="tx"><span class="ic">≡</span>Transactions</button>
    <span class="addslot"><button id="addBtn" aria-label="Add transaction">+</button></span>
    <button data-tab="plan"><span class="ic">◇</span>Plan</button>
    <button data-tab="insights"><span class="ic">▤</span>Insights</button>
  </nav>
</div>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="fullmodal" id="full"></div>
<div id="onb" hidden></div>
<div class="toast" id="toast"></div>
<div id="themeFade" aria-hidden="true"></div>

<script>
/* ============================================================================
   RIAL app script
   SECTIONS: [A] utils  [B] store/DB  [C] models+seed  [D] finance math
             [E] router+nav  [F] screens  [G] add-transaction keypad
             [H] settings/backup  [I] onboarding  [J] boot
   ========================================================================== */
"use strict";

/* ---- [0] CRASH GUARD — never let an error produce a silent black screen ---- */
(function () {
  function showError(title, detail) {
    try {
      var box = document.getElementById("__crash");
      if (!box) {
        box = document.createElement("div");
        box.id = "__crash";
        box.style.cssText =
          "position:fixed;inset:0;z-index:99999;background:#0b0d10;color:#ff6b6b;" +
          "font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:20px;" +
          "overflow:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;word-break:break-word";
        (document.body || document.documentElement).appendChild(box);
      }
      box.textContent =
        "Rial hit an error and stopped.\n\n" +
        title + "\n\n" + (detail || "") +
        "\n\n— If this persists: Settings › clear this site's data, or reinstall from Safari. " +
        "Your exported JSON backups are unaffected.";
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    showError(
      String(e.message || "Uncaught error"),
      (e.filename ? e.filename + ":" + e.lineno + ":" + e.colno + "\n" : "") +
        (e.error && e.error.stack ? e.error.stack : "")
    );
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    showError(
      "Unhandled promise rejection: " + (r && r.message ? r.message : String(r)),
      r && r.stack ? r.stack : ""
    );
  });
  window.__rialCrash = showError; // boot() calls this in its own catch
})();

/* ---- [A] UTILS -------------------------------------------------------- */
const U = (() => {
  const TZ = "Asia/Muscat";
  const fmtYMD = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit" });
  const money = new Intl.NumberFormat("en-OM", { style:"currency", currency:"OMR", minimumFractionDigits:3 });

  // all amounts stored as integer baisa (1 OMR = 1000 baisa)
  const toBaisa = (s) => {
    if (typeof s === "number") return Math.round(s * 1000);
    const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? 0 : Math.round(n * 1000);
  };
  const fmt = (baisa, opts={}) => {
    const v = (baisa || 0) / 1000;
    const s = money.format(Math.abs(v)).replace("OMR", "").trim();
    const sign = baisa < 0 ? "-" : (opts.plus ? "+" : "");
    return opts.bare ? sign + s : sign + s; // "12.450"
  };
  const fmtFull = (baisa) => "OMR " + fmt(baisa);

  const ymd = (d = new Date()) => fmtYMD.format(d);           // "2026-08-27"
  const monthKey = (d = new Date()) => ymd(d).slice(0, 7);     // "2026-08"
  const todayTs = () => { const [y,m,dd] = ymd().split("-").map(Number); return new Date(y, m-1, dd, 12).getTime(); };
  const parseYMD = (s) => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd, 12).getTime(); };

  const daysInMonth = (mk) => { const [y,m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const dayOfMonth = () => Number(ymd().slice(8,10));
  const daysLeftInMonth = () => daysInMonth(monthKey()) - dayOfMonth() + 1;

  const uid = () => "x" + Math.random().toString(36).slice(2, 10) + (performance.now()|0).toString(36);
  const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
  const groupBy = (arr, f) => arr.reduce((m,x)=>{ const k=f(x); (m[k]=m[k]||[]).push(x); return m; }, {});
  const sum = (arr, f=(x)=>x) => arr.reduce((s,x)=>s+f(x),0);

  const relDay = (ts) => {
    const a = ymd(new Date(ts)), t = ymd();
    if (a === t) return "Today";
    const y = new Date(); y.setDate(y.getDate()-1);
    if (a === ymd(y)) return "Yesterday";
    return new Date(ts).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
  };
  const isWeekend = (ts) => { const d = new Date(ts).getDay(); return d === 5 || d === 6; }; // Fri/Sat in Oman

  return { TZ, toBaisa, fmt, fmtFull, ymd, monthKey, todayTs, parseYMD, daysInMonth,
           dayOfMonth, daysLeftInMonth, uid, clamp, groupBy, sum, relDay, isWeekend };
})();

/* ---- [B] STORE / DB ------------------------------------------------- */
const DB = (() => {
  const NAME = "rial", VERSION = 1;
  const STORES = ["transactions","categories","recurring","wishlist","goals","envelopes","plans","notifications"];
  let db = null, useFallback = false;

  const open = () => new Promise((resolve) => {
    let req;
    try { req = indexedDB.open(NAME, VERSION); }
    catch (e) { useFallback = true; return resolve(); }
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:"id" }); });
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
    };
    req.onsuccess = (e) => { db = e.target.result; db.onerror = (ev)=>console.warn("idb err", ev); resolve(); };
    req.onerror = () => { useFallback = true; console.warn("IndexedDB unavailable, using localStorage"); resolve(); };
    req.onblocked = () => { useFallback = true; resolve(); };
  });

  // localStorage fallback helpers
  const lsKey = (s) => "rial:" + s;
  const lsAll = (s) => { try { return JSON.parse(localStorage.getItem(lsKey(s)) || "[]"); } catch { return []; } };
  const lsSave = (s, arr) => { try { localStorage.setItem(lsKey(s), JSON.stringify(arr)); } catch(e){ console.warn(e); } };

  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  const wrap = (req) => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

  const api = {
    get fallback(){ return useFallback; },
    async getAll(store){
      if (useFallback || !db) return lsAll(store);
      try { return await wrap(tx(store,"readonly").getAll()); }
      catch(e){ console.warn("getAll",store,e); return lsAll(store); }
    },
    async get(store, id){
      if (useFallback || !db) return lsAll(store).find(x => x.id === id) || null;
      try { return await wrap(tx(store,"readonly").get(id)); } catch(e){ return null; }
    },
    async put(store, obj){
      if (!obj.id) obj.id = U.uid();
      if (useFallback || !db){ const a = lsAll(store).filter(x=>x.id!==obj.id); a.push(obj); lsSave(store,a); return obj; }
      try { await wrap(tx(store,"readwrite").put(obj)); }
      catch(e){ console.warn("put",store,e); const a = lsAll(store).filter(x=>x.id!==obj.id); a.push(obj); lsSave(store,a); }
      return obj;
    },
    async del(store, id){
      if (useFallback || !db){ lsSave(store, lsAll(store).filter(x=>x.id!==id)); return; }
      try { await wrap(tx(store,"readwrite").delete(id)); }
      catch(e){ console.warn("del",store,e); lsSave(store, lsAll(store).filter(x=>x.id!==id)); }
    },
    async clear(store){
      if (useFallback || !db){ lsSave(store, []); return; }
      try { await wrap(tx(store,"readwrite").clear()); } catch(e){ lsSave(store, []); }
    },
    // meta = simple key/value settings
    async meta(key, def=null){
      if (useFallback || !db){ try { const v = localStorage.getItem("rial:meta:"+key); return v==null?def:JSON.parse(v); } catch { return def; } }
      try { const v = await wrap(db.transaction("meta","readonly").objectStore("meta").get(key)); return v==null?def:v; }
      catch(e){ return def; }
    },
    async setMeta(key, val){
      if (useFallback || !db){ try { localStorage.setItem("rial:meta:"+key, JSON.stringify(val)); } catch(e){} return; }
      try { await wrap(db.transaction("meta","readwrite").objectStore("meta").put(val, key)); }
      catch(e){ try { localStorage.setItem("rial:meta:"+key, JSON.stringify(val)); } catch(_){} }
    },
    async exportAll(){
      const out = { app:"rial", version:VERSION, exportedAt:new Date().toISOString(), meta:{}, data:{} };
      for (const s of STORES) out.data[s] = await api.getAll(s);
      const keys = ["settings","theme","csvMapping","smsPatterns","lastBackup","onboarded",
                    "salaryDay","monthlyIncome","savingsTargetPct","hourlyValue","soundOn","streak","streakDate","icsExportedAt",
                    "themeSchedule","themeManual"];
      for (const k of keys) out.meta[k] = await api.meta(k);
      return out;
    },
    async importAll(obj){
      if (!obj || obj.app !== "rial") throw new Error("Not a Rial backup file");
      for (const s of STORES){
        if (!obj.data[s]) continue;
        await api.clear(s);
        for (const row of obj.data[s]) await api.put(s, row);
      }
      for (const k in (obj.meta||{})) if (obj.meta[k] != null) await api.setMeta(k, obj.meta[k]);
    },
    open, STORES
  };
  return api;
})();

/* ---- [D] FINANCE MATH --------------------------------------------- */
const F = {
  monthTx(mk = U.monthKey()){ return S.tx.filter(t => (t.month || U.monthKey(new Date(t.ts))) === mk); },
  incomeThisMonth(mk){ return U.sum(F.monthTx(mk).filter(t => t.type === "income"), t => t.amount); },
  spentThisMonth(mk){ return U.sum(F.monthTx(mk).filter(t => t.type !== "income"), t => t.amount); },
  netThisMonth(mk){ return F.incomeThisMonth(mk) - F.spentThisMonth(mk); },

  fixedCommitments(){
    // sum of active recurring items normalised to a monthly figure
    return U.sum(S.recurring.filter(r => r.active !== false), r => {
      const a = r.amount || 0;
      if (r.cadence === "weekly") return Math.round(a * 52 / 12);
      if (r.cadence === "yearly") return Math.round(a / 12);
      if (r.cadence === "custom" && r.intervalDays) return Math.round(a * 30 / r.intervalDays);
      return a; // monthly
    });
  },
  savingsTarget(){
    const inc = S.settings.monthlyIncome || F.incomeThisMonth() || 0;
    return Math.round(inc * (S.settings.savingsTargetPct || 0) / 100);
  },
  monthTransfers(mk = U.monthKey()){ return U.sum(F.monthTx(mk).filter(t => t.type === "transfer"), t => t.amount); },

  /* --- envelopes (Monthly Plan) --- */
  planFor(mk = U.monthKey()){ return S.plans.find(p => p.month === mk) || null; },
  envelopesFor(mk = U.monthKey()){ return S.envelopes.filter(e => e.month === mk).sort((a,b) => (a.sort||0)-(b.sort||0)); },
  envelopeSpent(cat, mk = U.monthKey()){
    return U.sum(F.monthTx(mk).filter(t => t.type === "expense" && t.category === cat), t => t.amount);
  },
  allocatedTotal(mk = U.monthKey()){ return U.sum(F.envelopesFor(mk), e => e.allocated || 0); },
  unallocated(mk = U.monthKey()){
    const p = F.planFor(mk);
    const base = p ? p.salaryAmount : (S.settings.monthlyIncome || F.incomeThisMonth(mk));
    return base - F.allocatedTotal(mk) - F.monthTransfers(mk);
  },
  envelopePace(cat, allocated, mk = U.monthKey()){
    const spent = F.envelopeSpent(cat, mk);
    const left = allocated - spent;
    const dom = U.dayOfMonth(), dim = U.daysInMonth(mk);
    const expected = allocated * dom / dim;
    const projected = dom ? Math.round(spent / dom * dim) : 0;
    let state = "green";
    if (left <= 0) state = "empty";
    else if (projected > allocated) state = "red";
    else if (spent >= expected * 0.98 || spent >= allocated * 0.8) state = "amber";
    return { spent, left, expected, projected, state,
             pct: allocated ? U.clamp(spent / allocated * 100, 0, 100) : 0 };
  },

  // Safe to Spend today — envelope-aware when a Plan exists for this month.
  safeToSpendToday(){
    const mk = U.monthKey();
    const days = U.daysLeftInMonth();
    const p = F.planFor(mk);
    if (p){
      const envs = F.envelopesFor(mk);
      const flexLeft = U.sum(envs, e => Math.max(0, (e.allocated || 0) - F.envelopeSpent(e.category, mk)));
      const unalloc = Math.max(0, F.unallocated(mk));
      const remainingBudget = unalloc + flexLeft;
      return { perDay: Math.round(remainingBudget / days), remainingBudget, days,
               income: p.salaryAmount, spent: F.spentThisMonth(mk), envelopeAware: true };
    }
    const income = (S.settings.monthlyIncome || F.incomeThisMonth(mk));
    const spent = F.spentThisMonth(mk);
    const remainingBudget = income - F.fixedCommitments() - F.savingsTarget() - spent;
    return { perDay: Math.round(remainingBudget / days), remainingBudget, income, spent, days, envelopeAware: false };
  },

  /* --- goals --- */
  goalPct(g){ return g.target ? U.clamp((g.saved || 0) / g.target * 100, 0, 100) : 0; },
  totalSaved(){ return U.sum(S.goals, g => g.saved || 0); },
  avgMonthlyNet(){
    // average net over up to 3 prior complete months; fallback to a planned figure
    const nets = [];
    for (let i = 1; i <= 3; i++){
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      const mk = U.monthKey(d);
      if (F.monthTx(mk).length) nets.push(F.netThisMonth(mk));
    }
    if (nets.length) return Math.round(U.sum(nets) / nets.length);
    const inc = S.settings.monthlyIncome || 0;
    return Math.max(0, inc - F.fixedCommitments() - F.savingsTarget());
  },
  weeksToAfford(price){
    const perWeek = F.avgMonthlyNet() / 4.345;
    if (perWeek <= 0) return Infinity;
    return Math.ceil(price / perWeek);
  },

  /* --- subscriptions audit --- */
  subscriptions(){
    return S.recurring.filter(r => r.active !== false && r.type !== "income").map(r => {
      const a = r.amount || 0;
      const monthly = r.cadence === "weekly" ? Math.round(a * 52 / 12)
        : r.cadence === "yearly" ? Math.round(a / 12)
        : (r.cadence === "custom" && r.intervalDays) ? Math.round(a * 30 / r.intervalDays) : a;
      const perUse = r.usesPerMonth ? Math.round(monthly / r.usesPerMonth) : null;
      return { ...r, monthly, perUse };
    }).sort((x,y) => (y.perUse ?? -1) - (x.perUse ?? -1) || y.monthly - x.monthly);
  },

  last30(){
    const out = [];
    for (let i = 29; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = U.ymd(d);
      const dayTx = S.tx.filter(t => U.ymd(new Date(t.ts)) === key);
      out.push({ key, spent: U.sum(dayTx.filter(t=>t.type!=="income"), t=>t.amount) });
    }
    return out;
  },
  upcoming(days = 7){
    const now = U.todayTs(), horizon = now + days*86400000;
    return S.recurring.filter(r => r.active !== false && r.nextDue >= now - 86400000 && r.nextDue <= horizon)
                      .sort((a,b) => a.nextDue - b.nextDue);
  },
  roundupSaved(mk = U.monthKey()){
    return U.sum(F.monthTx(mk).filter(t => t.type !== "income"), t => {
      const r = 500 - (t.amount % 500); return r === 500 ? 0 : r;
    });
  },
};

function sparkSVG(series, key = "spent"){
  const vals = series.map(d => d[key]);
  const max = Math.max(1, ...vals);
  const W = 300, H = 44, n = vals.length;
  const pts = vals.map((v,i) => `${(i/(n-1))*W},${H - (v/max)*(H-6) - 3}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function weekNumbers(){
  const start = U.todayTs() - 6*86400000;
  const wk = S.tx.filter(t => t.ts >= start && t.type !== "income");
  const biggest = wk.reduce((m,t)=>Math.max(m,t.amount),0);
  const byCat = U.groupBy(wk, t => t.category);
  let topCat = null, topV = 0;
  for (const c in byCat){ const v = U.sum(byCat[c], t=>t.amount); if (v > topV){ topV = v; topCat = c; } }
  return { out:U.sum(wk,t=>t.amount), txn:wk.length, biggest, topCat };
}

            <div class="t2">${esc(t.category)}${t.source&&t.source!=="manual"?" · "+t.source:""}</div></div>
          <div class="amt mono ${t.type==="income"?"pos":""}">${t.type==="income"?"+":""}${U.fmt(t.amount)}</div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("") : emptyState("≡","No transactions yet","Tap + to add your first one.")}
  `;
};

/* ============ PLAN (envelopes · payments · wishlist · goals) ============ */
let planSub = "envelopes";
const PLAN_SUBS = [["envelopes","Envelopes"],["payments","Payments"],["wishlist","Wishlist"],["goals","Goals"]];

SCREENS.plan = () => `
  <div class="pagehead"><h1>Plan</h1><span class="sub">${monthName(U.monthKey()).split(" ")[0]}</span></div>
  <div class="seg" style="margin-bottom:14px">
    ${PLAN_SUBS.map(([k,l]) => `<button data-plansub="${k}" aria-pressed="${planSub===k}">${l}</button>`).join("")}

  ${planSub==="envelopes" ? planEnvelopes()
    : planSub==="payments" ? planPayments()
    : planSub==="wishlist" ? planWishlist()

`;

/* ---- Envelopes ---- */
function planEnvelopes(){
  const mk = U.monthKey();
  const plan = F.planFor(mk);
  const envs = F.envelopesFor(mk);
  if (!plan || !envs.length){
    return `
    ${emptyState("✉️","No plan for "+monthName(mk).split(" ")[0]+" yet","Split your salary into savings + spending envelopes.")}
    <button class="btn primary block" data-act="split-salary">Split my salary</button>`;
  }
  const unalloc = F.unallocated(mk);
  const totalAlloc = F.allocatedTotal(mk);
  const totalSpent = U.sum(envs, e => F.envelopeSpent(e.category, mk));
  return `
  <div class="card">
    <div class="stat3 mono">
      <div class="s"><div class="v">${U.fmt(totalAlloc)}</div><div class="k">allocated</div></div>
      <div class="s"><div class="v">${U.fmt(totalSpent)}</div><div class="k">spent</div></div>
      <div class="s"><div class="v" style="color:${unalloc<0?'var(--neg)':'var(--pos)'}">${U.fmt(unalloc)}</div><div class="k">unallocated</div></div>
    </div>
    <button class="btn sm block ghost" data-act="split-salary" style="margin-top:10px">Re-split salary</button>
  </div>
  ${envs.map(e => {
    const p = F.envelopePace(e.category, e.allocated, mk);
    const col = p.state==="empty"||p.state==="red" ? "var(--neg)" : p.state==="amber" ? "var(--warn)" : "var(--pos)";
    return `<div class="card tight" data-env="${e.id}">
      <div class="row between" style="margin-bottom:8px">
        <div class="row" style="gap:8px"><span>${(catByName(e.category)||{icon:"✉️"}).icon}</span><b style="font-size:15px">${esc(e.category)}</b></div>
        <span class="pill" style="color:${col}">${p.state==="empty"?"empty":p.state==="red"?"over pace":p.state==="amber"?"at pace":"on track"}</span>
      </div>
      <div class="progress"><i style="width:${p.pct.toFixed(1)}%;background:${col}"></i></div>
      <div class="row between tiny mono" style="margin-top:6px">
        <span class="faint">${U.fmt(p.spent)} spent</span>
        <span style="color:${p.left<0?'var(--neg)':'var(--text-dim)'}">${U.fmt(p.left)} left of ${U.fmt(e.allocated)}</span>
      </div>
      ${p.state==="empty" ? `<button class="btn sm block danger" data-act="move-env" data-to="${e.id}" style="margin-top:8px">Envelope empty — move money in</button>`
        : p.state==="amber" ? `<div class="tiny faint" style="margin-top:6px">⚠️ ${U.fmt(Math.round(p.expected))} is the pace budget for today</div>` : ""}
    </div>`;
  }).join("")}
  <button class="btn block ghost" data-act="add-env" style="margin-top:4px">+ Add envelope</button>
  `;
}

/* ---- Payments (recurring + subscription audit) ---- */

    ${pendingCardHTML()}

            <div><b style="font-size:15px">${esc(r.name)}</b>
              <div class="tiny faint">${r.cadence}${r.cadence==="custom"?` · ${r.intervalDays}d`:""} · next ${U.relDay(r.nextDue)}${r.active===false?" · paused":""}</div></div>

    <button class="btn primary block" data-act="add-recur" style="margin-top:6px">+ Add recurring payment</button>
  ` : `
    <div class="card">
      <div class="label muted tiny">Total monthly subscriptions</div>
      <div class="mono" style="font-size:26px;font-weight:750">${U.fmtFull(monthlySub)}</div>

  `}
  `;
}

/* ---- Wishlist ---- */
function planWishlist(){
  const now = Date.now();
  const items = S.wishlist.slice().sort((a,b) => (a.bought?1:0)-(b.bought?1:0) || a.unlockTs - b.unlockTs);
  return `
  ${items.length ? items.map(w => {
    const unlocked = w.unlockTs <= now;
    const daysLeft = Math.ceil((w.unlockTs - now) / 86400000);
    const sts = F.safeToSpendToday();
    const canAfford = sts.remainingBudget >= w.price;
    const weeks = F.weeksToAfford(w.price);
    const hrs = S.settings.hourlyValue ? (w.price / S.settings.hourlyValue) : null;
    return `<div class="card" data-wish="${w.id}" style="${w.bought?'opacity:.5':''}">
      <div class="row between">
        <div class="row" style="gap:12px">
          <div class="ic" style="width:46px;height:46px;font-size:24px;border-radius:12px;background:var(--bg-elev-2);display:grid;place-items:center;overflow:hidden">
            ${w.photo?`<img src="${w.photo}" style="width:100%;height:100%;object-fit:cover"/>`:(w.emoji||"🛍️")}</div>
          <div><b style="font-size:16px">${esc(w.name)}</b>
            <div class="mono tiny faint">${U.fmtFull(w.price)}${hrs?` · ${hrs.toFixed(1)} work hrs`:""}</div></div>
        </div>
        ${w.bought?`<span class="pill">bought</span>`:""}
      </div>
      ${w.bought ? "" : unlocked ? `
        <div class="divider"></div>
        <div class="pill" style="color:${canAfford?'var(--pos)':'var(--warn)'};margin-bottom:8px">
          ${canAfford?"✓ Unlocked — Safe-to-Spend says you can afford this now":"Unlocked — but it doesn't fit Safe-to-Spend yet"}</div>
        <div class="tiny faint">Saving pace: ${weeks===Infinity?"—":`~${weeks} week${weeks>1?"s":""}`} at your current net</div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn sm primary" data-act="wish-bought" data-id="${w.id}">Mark bought</button>
          <button class="btn sm ghost" data-act="wish-snooze" data-id="${w.id}">Snooze 30d</button>
        </div>
      ` : `
        <div class="divider"></div>
        <div class="row between">
          <div><div class="mono" style="font-size:20px;font-weight:750">${daysLeft}</div><div class="tiny faint">days until it unlocks</div></div>
          <div class="progress" style="flex:1;margin-left:16px"><i style="width:${(100*(30-daysLeft)/30).toFixed(0)}%"></i></div>
        </div>
      `}
    </div>`;
  }).join("") : emptyState("⏳","Wishlist is empty","Add something you want. It locks for 30 days before you can buy guilt-free.")}
  <button class="btn primary block" data-act="add-wish">+ Add to wishlist</button>
  `;
}

      <div style="text-align:right"><div class="mono" style="font-size:18px;font-weight:700;color:var(--pos)">${U.fmt(roundup)}</div>

function pendingCardHTML(){

  return `<div class="card" style="border-color:var(--warn)">

    ${S.pending.slice().sort((a,b)=>a.ts-b.ts).map(t => `
      <div class="tx" data-pending="${t.id}">
        <div class="ic">${catFor(t).icon}</div>

        <div class="row" style="gap:6px">
          <button class="btn sm primary" data-act="confirm-pending" data-id="${t.id}">${U.fmt(t.amount)} ✓</button>
          <button class="btn sm ghost danger" data-act="skip-pending" data-id="${t.id}">✕</button>
        </div>

SCREENS.insights = () => {
  const mk = U.monthKey();
  const prev = (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return U.monthKey(d); })();
  const cur = U.groupBy(F.monthTx(mk).filter(t=>t.type!=="income"), t=>t.category);
  const old = U.groupBy(F.monthTx(prev).filter(t=>t.type!=="income"), t=>t.category);
  const cats = [...new Set([...Object.keys(cur), ...Object.keys(old)])];
  const curV = Object.fromEntries(cats.map(c => [c, U.sum(cur[c]||[], t=>t.amount)]));
  const oldV = Object.fromEntries(cats.map(c => [c, U.sum(old[c]||[], t=>t.amount)]));
  const max = Math.max(1, ...cats.map(c => Math.max(curV[c], oldV[c])));
  cats.sort((a,b) => curV[b] - curV[a]);
  const biggest = F.monthTx(mk).filter(t=>t.type!=="income").sort((a,b)=>b.amount-a.amount).slice(0,5);
  const spent = F.spentThisMonth(mk), pace = spent / U.dayOfMonth(), projected = Math.round(pace * U.daysInMonth(mk));
  const wkend = U.sum(F.monthTx(mk).filter(t=>t.type!=="income" && U.isWeekend(t.ts)), t=>t.amount);
  const wk = spent - wkend;
  return `
  <div class="pagehead"><h1>Insights</h1><span class="sub">${monthName(mk)}</span></div>

  <div class="card">
    <h3 style="font-size:15px;margin-bottom:4px">Burn rate</h3>
    <div class="mono" style="font-size:22px;font-weight:750">${U.fmtFull(projected)}</div>
    <div class="tiny faint">projected month-end spend at current pace (${U.fmtFull(Math.round(pace))}/day)</div>
  </div>

  <div class="card">
    <h3 style="font-size:15px;margin-bottom:10px">This month vs ${monthName(prev)}</h3>
    <div class="bars">
      ${cats.length ? cats.slice(0,8).map(c => `
        <div class="b"><div class="lab"><span>${(catByName(c)||{icon:"•"}).icon} ${esc(c)}</span><span class="mono">${U.fmt(curV[c])}</span></div>
          <div class="track"><i style="width:${(curV[c]/max*100).toFixed(1)}%"></i></div></div>
        <div class="b prev"><div class="lab"><span class="tiny faint">last month</span><span class="tiny faint mono">${U.fmt(oldV[c])}</span></div>
          <div class="track"><i style="width:${(oldV[c]/max*100).toFixed(1)}%"></i></div></div>
      `).join("") : `<div class="tiny faint">No expenses this month yet.</div>`}
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:15px;margin-bottom:8px">Biggest expenses</h3>
    ${biggest.length ? biggest.map(t => `<div class="tx"><div class="ic">${catFor(t).icon}</div>
      <div class="mid"><div class="t1">${esc(t.note||t.category)}</div><div class="t2">${U.relDay(t.ts)}</div></div>
      <div class="amt mono">${U.fmt(t.amount)}</div></div>`).join("") : `<div class="tiny faint">Nothing yet.</div>`}
  </div>

  <div class="card">
    <h3 style="font-size:15px;margin-bottom:8px">Weekday vs weekend</h3>
    <div class="bars">
      <div class="b"><div class="lab"><span>Weekdays (Sun–Thu)</span><span class="mono">${U.fmt(wk)}</span></div>
        <div class="track"><i style="width:${(wk/Math.max(1,spent)*100).toFixed(1)}%"></i></div></div>
      <div class="b"><div class="lab"><span>Weekend (Fri–Sat)</span><span class="mono">${U.fmt(wkend)}</span></div>
        <div class="track"><i style="width:${(wkend/Math.max(1,spent)*100).toFixed(1)}%"></i></div></div>
    </div>
  </div>
  `;
};

function monthName(mk){ const [y,m] = mk.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }
function emptyState(ic,t,p){ return `<div class="empty"><div class="e-ic">${ic}</div><h3 style="margin-top:8px">${t}</h3><p>${p}</p></div>`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* wire per-screen events */
function wireScreen(){
  document.querySelectorAll("[data-open]").forEach(el =>
    el.addEventListener("click", () => openOverlay(el.dataset.open)));

  const s = document.getElementById("txSearch");
  if (s) s.addEventListener("input", () => { txFilter.q = s.value; const pos = s.selectionStart;
    render(); const n = document.getElementById("txSearch"); if (n){ n.focus(); n.setSelectionRange(pos,pos); } });

  document.querySelectorAll("[data-fcat]").forEach(b => b.addEventListener("click", () => {
    txFilter.cat = b.dataset.fcat || null; render();
  }));

  document.querySelectorAll("[data-tx]").forEach(el => {
    let timer;
    const openEdit = () => editTx(el.dataset.tx);
    el.addEventListener("touchstart", () => { timer = setTimeout(openEdit, 500); }, {passive:true});
    el.addEventListener("touchend", () => clearTimeout(timer));
    el.addEventListener("touchmove", () => clearTimeout(timer));
    el.addEventListener("click", openEdit);
  });

  // Plan sub-tabs + toggles
  document.querySelectorAll("[data-plansub]").forEach(b => b.addEventListener("click", () => { planSub = b.dataset.plansub; render(); }));
  document.querySelectorAll("[data-payview]").forEach(b => b.addEventListener("click", () => { payView = b.dataset.payview; render(); }));
  document.querySelectorAll("[data-recur]").forEach(el => el.addEventListener("click", (e) => {
    if (e.target.closest("[data-act]")) return; editRecurring(el.dataset.recur);
  }));
  document.querySelectorAll("[data-goal]").forEach(el => el.addEventListener("click", (e) => {
    if (e.target.closest("[data-act]")) return; editGoal(el.dataset.goal);
  }));
  document.querySelectorAll("[data-wish]").forEach(el => el.addEventListener("click", (e) => {
    if (e.target.closest("[data-act]")) return; editWishlist(el.dataset.wish);
  }));
  document.querySelectorAll("[data-env]").forEach(el => el.addEventListener("click", (e) => {
    if (e.target.closest("[data-act]")) return; editEnvelope(el.dataset.env);
  }));

  // generic action buttons
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    handleAct(b.dataset.act, b.dataset);
  }));

  // notification bell
  const bell = document.getElementById("bell");
  if (bell) bell.addEventListener("click", () => openFull(notifCenterHTML()));
}

function handleAct(act, d){
  const map = {
    "split-salary": openSplitSalary,
    "add-env": () => editEnvelope(null),
    "move-env": () => moveBetweenEnvelopes(d.to),
    "add-recur": () => editRecurring(null),
    "set-uses": () => setUsesPerMonth(d.id),
    "add-wish": () => editWishlist(null),
    "wish-bought": () => markWishBought(d.id),
    "wish-snooze": () => snoozeWish(d.id),
    "add-goal": () => editGoal(null),
    "move-savings": () => moveToSavings(d.id),
    "sweep-roundup": sweepRoundups,
    "confirm-pending": () => confirmPending(d.id),
    "skip-pending": () => skipPending(d.id),
    "csv-import": () => openOverlay("csv"),
    "sms-paste": () => openOverlay("sms"),
    "ocr": () => openOverlay("ocr"),
    "export-ics": exportICS,
    "open-wrapped": () => openWrapped(prevMonthKey()),
    "edit-cats": () => openOverlay("cats"),
    "edit-sms": () => openOverlay("smsPatterns"),
  };
  (map[act] || (() => toast("?" + act)))();
}

/* ---- [G] ADD / EDIT TRANSACTION (keypad) --------------------------- */
let draft = null;
function newDraft(){
  const mru = S.cats.filter(c => !c.isIncome).sort((a,b) => (b.uses||0)-(a.uses||0))[0];
  return { id:null, raw:"0", type:"expense", category: mru ? mru.name : "Other", note:"",
           ymd: U.ymd(), source:"manual" };
}
function keypadHTML(){
  const d = draft;
  const cats = S.cats.filter(c => d.type === "income" ? c.isIncome : !c.isIncome);
  const val = displayAmount(d.raw);
  return `
  <h2>${d.id ? "Edit" : "Add"} transaction</h2>
  <div class="seg" style="margin-bottom:10px">
    <button data-type="expense" aria-pressed="${d.type==="expense"}">Expense</button>
    <button data-type="income" aria-pressed="${d.type==="income"}">Income</button>
  </div>
  <div id="keypad">
    <div class="amountline"><span class="cur">OMR</span><span class="val mono" id="kpVal">${val}</span></div>
    <div class="scroll-x" style="margin:8px 0 2px">
      ${cats.map(c => `<button class="chip" data-cat="${esc(c.name)}" aria-pressed="${d.category===c.name}">${c.icon} ${esc(c.name)}</button>`).join("")}
    </div>
    <div class="field" style="margin:10px 0 4px"><input id="kpNote" placeholder="Note (optional)" value="${esc(d.note)}" /></div>
    <div class="field" style="margin:0 0 6px"><input id="kpDate" type="date" value="${d.ymd}" /></div>
    <div class="keys">
      ${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k => `<button data-k="${k}">${k}</button>`).join("")}
    </div>
    <div class="row" style="gap:10px">
      ${d.id ? `<button class="btn danger" id="kpDel">Delete</button>` : ""}
      <button class="btn primary block" id="kpSave">Save</button>
    </div>
  </div>`;
}
function displayAmount(raw){
  if (raw.includes(".")){ const [a,b] = raw.split("."); return a + "." + b.slice(0,3); }
  return raw;
}
function draftBaisa(){
  const n = parseFloat(draft.raw); return isNaN(n) ? 0 : Math.round(n * 1000);
}
function openKeypad(){
  draft = draft || newDraft();
  openSheet(keypadHTML());
  wireKeypad();
}
function wireKeypad(){
  SHEET.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    draft.type = b.dataset.type;
    const first = S.cats.find(c => draft.type==="income" ? c.isIncome : !c.isIncome);
    if (draft.type === "income" && !catByName(draft.category)?.isIncome) draft.category = first?.name || "Salary";
    if (draft.type === "expense" && catByName(draft.category)?.isIncome) draft.category = first?.name || "Other";
    SHEET.innerHTML = `<div class="grabber"></div>${keypadHTML()}`; wireKeypad();
  }));
  SHEET.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    draft.category = b.dataset.cat;
    SHEET.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat===draft.category)));
  }));
  SHEET.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    if (k === "⌫") draft.raw = draft.raw.length > 1 ? draft.raw.slice(0,-1) : "0";
    else if (k === "."){ if (!draft.raw.includes(".")) draft.raw = draft.raw + "."; }
    else {
      const dec = draft.raw.split(".")[1];
      if (dec && dec.length >= 3) return;                 // max 3 decimal places (baisa)
      if (draft.raw.length >= 12) return;
      draft.raw = draft.raw === "0" ? k : draft.raw + k;
    }
    const el = document.getElementById("kpVal");
    el.textContent = displayAmount(draft.raw); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }));
  const note = document.getElementById("kpNote"); if (note) note.addEventListener("input", () => draft.note = note.value);
  const date = document.getElementById("kpDate"); if (date) date.addEventListener("change", () => draft.ymd = date.value);
  const save = document.getElementById("kpSave"); if (save) save.addEventListener("click", saveDraft);
  const del = document.getElementById("kpDel"); if (del) del.addEventListener("click", () => deleteTx(draft.id));
}
async function saveDraft(){
  const amount = draftBaisa();
  if (amount <= 0){ toast("Enter an amount"); return; }
  const ts = U.parseYMD(draft.ymd);
  const rec = {
    id: draft.id || U.uid(), ts, month: draft.ymd.slice(0,7),
    amount, type: draft.type, category: draft.category, note: draft.note.trim(),
    source: draft.source || "manual",
  };

  await DB.put("transactions", rec);
  const c = catByName(draft.category);
  if (c){ c.uses = (c.uses||0) + 1; await DB.put("categories", c); }
  await updateStreak();
  await refresh();
  if (S.settings.soundOn) tick();
  closeSheet(); draft = null;
  toast(wasEdit ? "Updated" : "Saved");
  render();
  bounceAdd();

}

/* streak: increment when a day passes with spend <= safe-to-spend, else reset */
async function updateStreak(){
  const today = U.ymd();
  const last = await DB.meta("streakDate", null);
  if (last === today) return;
  const sts = F.safeToSpendToday();
  let streak = await DB.meta("streak", 0);
  streak = sts.perDay >= 0 ? streak + 1 : 0;
  await DB.setMeta("streak", streak); await DB.setMeta("streakDate", today);
  S.settings.streak = streak;
}

/* optional sound */
let AC;
function tick(){ try { AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(.15, AC.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+.12);
  o.start(); o.stop(AC.currentTime + .13); } catch(e){} }
function chime(){ try { AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  [523,659,784].forEach((f,i) => { const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime + i*.09;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.4); o.start(t); o.stop(t+.42); }); } catch(e){} }
async function checkGoalChimes(){
  const done = new Set(await DB.meta("goalsDone", []));
  let changed = false;
  for (const g of S.goals){
    if ((g.saved || 0) >= g.target && !done.has(g.id)){
      done.add(g.id); changed = true;
      if (S.settings.soundOn) chime();
      toast("🎉 Goal reached: " + g.name);
    }
    if ((g.saved || 0) < g.target && done.has(g.id)){ done.delete(g.id); changed = true; }
  }
  if (changed) await DB.setMeta("goalsDone", [...done]);
}

function splitRemaining(){
  const s = splitState;
  const salaryB = U.toBaisa(s.salary);
  const goalsB = U.sum(s.goals, g => U.toBaisa(g.amount));
  const envB = U.sum(s.envs, e => U.toBaisa(e.amount));
  return { salaryB, goalsB, envB, left: salaryB - goalsB - envB };
}

/* ---- image downscale (wishlist photo / OCR preview) ---- */
function downscaleImage(file, maxW){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}

/* ---- ICS calendar export ---- */
function icsSignature(){
  const parts = S.recurring.filter(r => r.active !== false).map(r => `${r.id}:${r.nextDue}:${r.amount}:${r.cadence}`)
    .concat(S.wishlist.filter(w => !w.bought).map(w => `w${w.id}:${w.unlockTs}`))
    .concat([`salary:${S.settings.salaryDay}`]);
  return parts.sort().join("|");
}
function icsIsStale(){
  if (!S.settings.icsExportedAt) return false;         // never exported -> not "stale", just absent
  return S.settings.icsSignature !== icsSignature();
}
async function markICSStale(){ /* signature recomputed live; nothing to persist */ }

function icsDate(ts){ // local date -> YYYYMMDD (all-day)
  return U.ymd(new Date(ts)).replace(/-/g, "");
}
function icsEscape(s){ return String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
function buildICS(){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Rial//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const stamp = icsDate(U.todayTs()) + "T090000";
  const ev = (uid, date, summary, desc, alarmTrigger, rrule) => {
    L.push("BEGIN:VEVENT", `UID:${uid}@rial`, `DTSTAMP:${stamp}Z`,
      `DTSTART;VALUE=DATE:${date}`, `SUMMARY:${icsEscape(summary)}`, `DESCRIPTION:${icsEscape(desc||"")}`);
    if (rrule) L.push("RRULE:" + rrule);
    L.push("BEGIN:VALARM", `TRIGGER:${alarmTrigger}`, "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(summary)}`, "END:VALARM", "END:VEVENT");
  };
  // recurring payments — next 6 occurrences each, alarm 09:00 the day before (-PT15H from midnight)
  S.recurring.filter(r => r.active !== false).forEach(r => {
    let due = r.nextDue;
    for (let i = 0; i < 6; i++){
      ev(`pay-${r.id}-${i}`, icsDate(due), `Pay: ${r.name} (${U.fmtFull(r.amount)})`, `Recurring ${r.cadence} payment`, "-PT15H");
      due = advanceDue(due, r.cadence, r.intervalDays);
    }
  });
  // wishlist unlocks — alarm that morning (PT9H after midnight)
  S.wishlist.filter(w => !w.bought).forEach(w =>
    ev(`wish-${w.id}`, icsDate(w.unlockTs), `Wishlist unlocked: ${w.name}`, `${U.fmtFull(w.price)} — check Safe-to-Spend before buying`, "PT9H"));
  // salary day — monthly, "split your salary"
  const sd = String(S.settings.salaryDay).padStart(2,"0");
  const firstSalary = (() => { const d = new Date(); d.setDate(S.settings.salaryDay);
    if (d.getTime() < U.todayTs()) d.setMonth(d.getMonth()+1); return icsDate(d.getTime()); })();
  ev("salary-split", firstSalary, "Split your salary", "Fund goals first, then top up envelopes in Rial", "PT8H", "FREQ=MONTHLY;BYMONTHDAY=" + Number(sd));
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
async function exportICS(){
  const ics = buildICS();
  const blob = new Blob([ics], { type:"text/calendar" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "rial-reminders.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  await DB.setMeta("icsExportedAt", new Date().toISOString());
  await DB.setMeta("icsSignature", icsSignature());
  await refresh();
  toast("Calendar exported — open it to add to iPhone Calendar");
  if (FULL.classList.contains("open")) openFull(settingsHTML());
}

/* ============ [R] CSV IMPORT ====================================== */
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ","){ row.push(cur); cur = ""; }
      else if (ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch === "\r"){ /* skip */ }
      else cur += ch;
    }
  }
  if (cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function guessDate(s){
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m){ let [_,d,mo,y] = m; if (y.length === 2) y = "20"+y; return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  m = s.match(/(\d{1,2})[ \-]([A-Za-z]{3})[A-Za-z]*[ \-](\d{2,4})/);
  if (m){ const mo = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[2].toLowerCase())+1;
    let y = m[3]; if (y.length === 2) y = "20"+y; if (mo) return `${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  const d = new Date(s); return isNaN(d) ? U.ymd() : U.ymd(d);
}

function csvParseRow(r, map){
  const dateRaw = map.date >= 0 ? r[map.date] : "";
  let amtRaw = map.amount >= 0 ? r[map.amount] : "";
  let type = "expense";
  let amt = U.toBaisa((amtRaw||"").replace(/[()]/g,"").replace(/,/g,""));
  if (map.credit >= 0 && r[map.credit] && U.toBaisa(r[map.credit]) > 0){ amt = U.toBaisa(r[map.credit]); type = "income"; }
  else if (/-/.test(amtRaw) || /^\(.*\)$/.test((amtRaw||"").trim())){ amt = Math.abs(amt); type = "expense"; }
  else if (amt < 0){ amt = Math.abs(amt); }
  else if (map.credit < 0 && amt > 0 && /cr|credit|salary|deposit/i.test(r[map.desc]||"")) type = "income";
  const ymd = guessDate(dateRaw);
  const desc = (map.desc >= 0 ? r[map.desc] : "").trim();
  return { ymd, ts:U.parseYMD(ymd), month:ymd.slice(0,7), amount:Math.abs(amt), type, note:desc, category: type==="income"?"Other income":"Other", source:"csv" };
}
function isDuplicate(rec){
  return S.tx.some(t => t.amount === rec.amount && U.ymd(new Date(t.ts)) === rec.ymd &&
    (t.note||"").toLowerCase().slice(0,20) === (rec.note||"").toLowerCase().slice(0,20));
}

/* ============ [S] SMS PASTE PARSER + shared extractor =============== */
function parseSMSBlock(text, patterns){
  for (const p of patterns){
    let re; try { re = new RegExp(p.re, "i"); } catch { continue; }
    const m = text.match(re);
    if (m){
      const amount = U.toBaisa((m[1] || "").replace(/,/g, ""));
      if (amount <= 0) continue;
      return {
        amount, type: p.dir || "expense",
        note: (m[2] || "").trim().replace(/\s+/g, " ").replace(/[.\s]+$/, "") || "(unknown merchant)",
        ymd: m[3] ? guessDate(m[3]) : U.ymd(),
        matched: p.name,
      };
    }
  }
  // last-ditch: any "OMR <number>"
  const m = text.match(/OMR\s*([0-9]+(?:\.[0-9]+)?)/i) || text.match(/([0-9]+\.[0-9]{3})/);
  if (m && U.toBaisa(m[1]) > 0){
    const credit = /credit|deposit|received|salary|refund/i.test(text);
    return { amount:U.toBaisa(m[1]), type: credit?"income":"expense", note:"(check merchant)", ymd:U.ymd(), matched:"fallback" };
  }
  return null;
}
function splitBlocks(text){
  return text.split(/\n\s*\n|\n(?=[A-Z][a-z]+\s*:)|\r/).map(s => s.trim()).filter(s => s.length > 6);
}
let smsState = null;

/* shared review UI for SMS-paste and OCR — amounts held as OMR strings */
function normalizeReviewItems(parsed){
  return parsed.map(p => ({
    raw: p.raw || "", matched: p.matched || "",
    amt: p.amount ? String(p.amount / 1000) : "",
    type: p.type || "expense",
    note: p.note && p.note !== "(unknown merchant)" && p.note !== "(check merchant)" ? p.note : "",
    ymd: p.ymd || U.ymd(),
    category: (p.type === "income") ? "Other income" : "Other",
  }));
}

  const inp = 'style="background:var(--bg-elev-2);border:1px solid var(--line);border-radius:8px;padding:8px"';
  return items.map((it,i) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">

function wireReviewRows(){
  FULL.querySelectorAll("[data-rv]").forEach(el => el.addEventListener("input", () => {
    reviewState[+el.dataset.rv][el.dataset.f] = el.value;
  }));
}
let reviewState = [];
async function saveReviewItems(source){
  let n = 0;
  for (const it of reviewState){
    const amt = U.toBaisa(it.amt); if (amt <= 0) continue;
    const ymd = /^\d{4}-\d{2}-\d{2}$/.test(it.ymd) ? it.ymd : U.ymd();
    await DB.put("transactions", { id:U.uid(), ts:U.parseYMD(ymd), month:ymd.slice(0,7), amount:amt,
      type:it.type, category: it.category || (it.type==="income"?"Other income":"Other"),
      note:(it.note||"").trim(), source });
    n++;
  }
  await refresh(); closeFull(); toast(n ? `Saved ${n}` : "Nothing to save"); render();
}
function smsReview(parsed){
  reviewState = normalizeReviewItems(parsed);
  FULL.querySelector("#smsReview").innerHTML = `
    <div class="card">
      <b style="font-size:15px">Review ${reviewState.length} — fix anything, then save</b>
      ${reviewRowsHTML(reviewState, true)}
      <button class="btn primary block" id="smsSave" style="margin-top:12px">Save all</button>
    </div>`;
  wireReviewRows();
  FULL.querySelector("#smsSave").addEventListener("click", () => saveReviewItems("sms"));
}

/* ============ [T] SCREENSHOT OCR (Tesseract.js, on-device) ========= */
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
let tesseractLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = TESSERACT_URL; s.onload = () => resolve(window.Tesseract);
    s.onerror = () => { tesseractLoading = null; reject(new Error("Couldn't load the OCR engine (needs network the first time)")); };
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
function ocrHTML(){
  return `
  <button class="btn ghost" onclick="closeFull()" style="margin-bottom:8px">← Close</button>
  <div class="pagehead"><h1>Scan a screenshot</h1></div>
  <div class="card">
    <p class="tiny faint" style="margin-bottom:10px">Photograph or upload a bank SMS, bank-app screen, or receipt.
      Text recognition runs entirely on this device. The first scan downloads the OCR engine (~2–4 MB) + English data (~10–15 MB), then works offline.</p>
    <input type="file" id="ocrFile" accept="image/*" capture="environment"/>
    <div id="ocrProgress" class="tiny faint" style="margin-top:10px"></div>
  </div>
  <div id="ocrReview"></div>
  `;
}
function wireOCR(){
  FULL.querySelector("#ocrFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const prog = FULL.querySelector("#ocrProgress");
    const thumb = await downscaleImage(f, 700);
    prog.textContent = "Loading OCR engine…";
    let T;
    try { T = await loadTesseract(); } catch (err){ prog.textContent = "⚠️ " + err.message; return; }
    prog.textContent = "Recognising text… 0%";
    let text = "";
    try {
      const res = await T.recognize(thumb, "eng", { logger: (m) => {
        if (m.status === "recognizing text") prog.textContent = `Recognising text… ${Math.round(m.progress*100)}%`;
      }});
      text = res.data.text || "";
    } catch (err){ prog.textContent = "⚠️ OCR failed: " + err.message; return; }
    prog.textContent = "Done. Review below.";
    const blocks = splitBlocks(text);
    const cand = blocks.length ? blocks : [text];
    const items = cand.map(b => ({ raw:b, ...(parseSMSBlock(b, S.settings.smsPatterns) || { amount:0, type:"expense", note:"", ymd:U.ymd(), matched:"none" }) }))
                      .filter(it => it.amount > 0 || it.raw.length > 20);
    ocrReview(thumb, items.length ? items : [{ raw:text, amount:0, type:"expense", note:"", ymd:U.ymd(), matched:"none" }]);
  });
}
function ocrReview(thumb, parsed){
  reviewState = normalizeReviewItems(parsed);
  const rawText = parsed.map(i => i.raw).join("\n---\n");
  FULL.querySelector("#ocrReview").innerHTML = `
    <div class="card">
      <div class="row" style="gap:12px;align-items:flex-start">
        <img src="${thumb}" style="width:120px;border-radius:10px;border:1px solid var(--line)"/>
        <div class="tiny faint">OCR is imperfect on bank UIs — check every field before saving.</div>
      </div>
      <div class="divider"></div>
      ${reviewRowsHTML(reviewState, false)}
      <button class="btn primary block" id="ocrSave" style="margin-top:12px">Save</button>
      <details style="margin-top:10px"><summary class="tiny faint">Raw OCR text</summary><pre class="tiny" style="white-space:pre-wrap">${esc(rawText)}</pre></details>
    </div>`;
  wireReviewRows();
  FULL.querySelector("#ocrSave").addEventListener("click", () => saveReviewItems("ocr"));
}

function swState(){
  try { return navigator.serviceWorker && navigator.serviceWorker.controller ? "active" : "registering"; }
  catch { return "n/a"; }
}
async function resetApp(){
  toast("Clearing cache…");
  try {
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs){ try { r.active && r.active.postMessage({ type:"CLEAR_CACHES" }); } catch(_){} await r.unregister(); }
    }
    if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch(e){ console.warn("reset", e); }
  location.reload();
}
FULL.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-theme-set]");
  if (t){ await pickThemeManually(t.dataset.themeSet); openFull(settingsHTML()); return; }
  const sm = e.target.closest("[data-sched-mode]");
  if (sm){ await saveSchedule({ mode: sm.dataset.schedMode }); openFull(settingsHTML()); return; }
  if (e.target.id === "schedAddWin"){
    const w = { ...DEFAULT_SCHEDULE, ...(S.settings.themeSchedule || {}) }.windows.slice();
    w.push({ start: "18:00", end: "06:00", theme: "midnight" });
    await saveSchedule({ windows: w }); openFull(settingsHTML()); return;
  }
  const wd = e.target.closest("[data-win-del]");
  if (wd){
    const w = (S.settings.themeSchedule.windows || []).slice();
    w.splice(+wd.dataset.winDel, 1);
    await saveSchedule({ windows: w }); openFull(settingsHTML()); return;
  }
  if (e.target.id === "schedResume"){ await resumeSchedule(); openFull(settingsHTML()); return; }
  const act = e.target.closest("[data-act]");
  if (act){ handleAct(act.dataset.act, act.dataset); return; }
  if (e.target.id === "setSaveMoney"){
    await DB.setMeta("monthlyIncome", U.toBaisa(val("setIncome")));
    await DB.setMeta("salaryDay", U.clamp(parseInt(val("setSalaryDay"))||25,1,28));

/* ============ THEME ENGINE + AUTO-SCHEDULER ======================== *
 * THEME_META is the single registry: to add a theme, add its CSS
 * :root[data-theme="id"] palette block AND one line here.
 * ----------------------------------------------------------------- */
const THEME_META = {
  midnight: { name: "Midnight", bg: "#0b0d10", scheme: "dark"  },
  paper:    { name: "Paper",    bg: "#f6f7f9", scheme: "light" },
  desert:   { name: "Desert",   bg: "#1c1610", scheme: "dark"  },
  depth:    { name: "Depth",    bg: "#070f1c", scheme: "dark"  },
};
const THEME_IDS = Object.keys(THEME_META);
const themeName = (id) => (THEME_META[id] || {}).name || id || "Midnight";
const validTheme = (id) => (THEME_META[id] ? id : "midnight");
const DEFAULT_SCHEDULE = { mode: "off", base: "midnight", windows: [], systemLight: "paper", systemDark: "midnight" };

function currentThemeId(){ return document.documentElement.getAttribute("data-theme") || "midnight"; }

function applyTheme(name){
  name = validTheme(name);
  document.documentElement.setAttribute("data-theme", name);
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const mt = document.getElementById("metaTheme");
  if (mt) mt.setAttribute("content", bg || (THEME_META[name] || {}).bg || "#0b0d10");
}
async function applyThemeFromStore(){ applyTheme(await DB.meta("theme", "midnight")); }

/* --- crossfade (opacity only) --- */
let _fadeT1, _fadeT2;
function applyThemeSmooth(id){
  id = validTheme(id);
  const ov = document.getElementById("themeFade");
  if (!ov || currentThemeId() === id){ applyTheme(id); return; }
  clearTimeout(_fadeT1); clearTimeout(_fadeT2);
  ov.style.background = (THEME_META[id] || {}).bg || "#0b0d10";
  ov.style.transition = "none";
  ov.style.opacity = "0";
  void ov.offsetWidth;                       // reflow so the next change animates
  ov.style.transition = "opacity .2s ease";
  ov.style.opacity = "1";
  _fadeT1 = setTimeout(() => {
    applyTheme(id);                           // swap palette while covered
    void ov.offsetWidth;
    ov.style.opacity = "0";
    _fadeT2 = setTimeout(() => { ov.style.transition = ""; }, 260);
  }, 200);
}

/* --- schedule maths (pure, `now` injectable for tests) --- */
function parseHM(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "")); if (!m) return null;
  const h = +m[1], mn = +m[2]; if (h > 23 || mn > 59) return null; return h * 60 + mn; }
function fmtHM(mins){ mins = ((Math.round(mins) % 1440) + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0"); }
function windowActive(w, mins){
  const s = parseHM(w && w.start), e = parseHM(w && w.end);
  if (s == null || e == null || s === e) return false;
  return (s < e) ? (mins >= s && mins < e) : (mins >= s || mins < e);   // wrap past midnight
}
function scheduledThemeAt(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode === "off") return null;
  if (sch.mode === "system"){
    let dark = false;
    try { dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
    return validTheme(dark ? sch.systemDark : sch.systemLight);
  }
  const mins = now.getHours() * 60 + now.getMinutes();
  for (const w of (sch.windows || [])) if (windowActive(w, mins)) return validTheme(w.theme);
  return sch.base ? validTheme(sch.base) : null;
}
function nextBoundaryAfter(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode !== "windows") return null;
  const marks = [...new Set((sch.windows || [])
    .flatMap(w => [parseHM(w.start), parseHM(w.end)]).filter(m => m != null))].sort((a, b) => a - b);
  if (!marks.length) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  let next = marks.find(m => m > mins);
  const d = new Date(now); d.setSeconds(0, 0);
  if (next == null){ next = marks[0]; d.setDate(d.getDate() + 1); }
  d.setHours(Math.floor(next / 60), next % 60, 0, 0);
  return d.getTime();
}
function manualExpired(man, nowTs = Date.now()){
  return !!(man && man.until != null && nowTs >= man.until);
}

/* --- defer switches during interaction --- */
function interactionBusy(){
  try {
    if (SHEET.classList.contains("open")) return true;      // keypad = "typing an amount", edit sheets
    if (FULL.classList.contains("open")) return true;        // settings / overlays / split-salary
    if (ONB && !ONB.hidden) return true;                     // onboarding
    if (document.getElementById("wrapWrap")) return true;    // Monthly Wrapped story
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || "")) return true;
  } catch (_) {}
  return false;
}
let pendingScheduledTheme = null;
function requestThemeSwitch(id, opts = {}){
  id = id && validTheme(id);
  if (!id || currentThemeId() === id){ pendingScheduledTheme = null; return; }
  if (interactionBusy()){ pendingScheduledTheme = id; return; }
  pendingScheduledTheme = null;
  opts.smooth === false ? applyTheme(id) : applyThemeSmooth(id);
}
function flushPendingThemeSwitch(){
  if (pendingScheduledTheme && !interactionBusy()){
    const id = pendingScheduledTheme; pendingScheduledTheme = null;
    applyThemeSmooth(id);
  }
}

/* --- evaluation loop --- */
function evaluateSchedule(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode === "off") return;
  let man = S.settings.themeManual;
  if (man && manualExpired(man, now.getTime())){
    S.settings.themeManual = null; man = null;
    DB.setMeta("themeManual", null);
  }
  if (man) return;                                // manual pick still wins
  const want = scheduledThemeAt(now);
  if (want && want !== currentThemeId()){
    requestThemeSwitch(want);
    S.settings.theme = want;
    DB.setMeta("theme", want);
  }
}
let _schedInterval = null, _schedMQBound = false;
function startScheduler(){
  clearInterval(_schedInterval);
  evaluateSchedule();
  _schedInterval = setInterval(() => evaluateSchedule(), 30000);
  if (!_schedMQBound && window.matchMedia){
    try {
      const mq = matchMedia("(prefers-color-scheme: dark)");
      const h = () => evaluateSchedule();
      mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
      _schedMQBound = true;
    } catch (_) {}
  }
}

/* --- what theme to show at startup --- */
function resolveThemeOnBoot(){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  let man = S.settings.themeManual;
  if (man && manualExpired(man)){ S.settings.themeManual = null; DB.setMeta("themeManual", null); man = null; }
  let id = validTheme(S.settings.theme);
  if (man) id = validTheme(man.theme);
  else if (sch.mode !== "off") id = scheduledThemeAt() || id;
  S.settings.theme = id;
  DB.setMeta("theme", id);
  applyTheme(id);
}

/* --- manual pick / resume (called from settings) --- */
async function pickThemeManually(id){
  id = validTheme(id);
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  let man = null;
  if (sch.mode === "windows") man = { theme: id, until: nextBoundaryAfter() };
  else if (sch.mode === "system") man = { theme: id, until: null };
  await DB.setMeta("themeManual", man);
  S.settings.themeManual = man;
  await DB.setMeta("theme", id);
  S.settings.theme = id;
  applyThemeSmooth(id);
}
async function resumeSchedule(){
  await DB.setMeta("themeManual", null);
  S.settings.themeManual = null;
  const want = scheduledThemeAt();
  if (want){ await DB.setMeta("theme", want); S.settings.theme = want; applyThemeSmooth(want); }
}
async function saveSchedule(patch){
  const sch = { ...DEFAULT_SCHEDULE, ...(S.settings.themeSchedule || {}), ...patch };
  sch.windows = (sch.windows || []).map(w => ({ start: w.start, end: w.end, theme: validTheme(w.theme) }));
  if (sch.mode === "off"){ S.settings.themeManual = null; await DB.setMeta("themeManual", null); }
  await DB.setMeta("themeSchedule", sch);
  S.settings.themeSchedule = sch;
  evaluateSchedule();
}

/* ---- recurring rollover (auto-log pending when due) ---- */
function advanceDue(ts, cadence, intervalDays){
  const d = new Date(ts);
  if (cadence === "weekly") d.setDate(d.getDate() + 7);
  else if (cadence === "yearly") d.setFullYear(d.getFullYear() + 1);
  else if (cadence === "custom" && intervalDays) d.setDate(d.getDate() + (intervalDays || 30));
  else d.setMonth(d.getMonth() + 1);
  d.setHours(12, 0, 0, 0);
  return d.getTime();
}
async function rollRecurring(){
  const today = U.todayTs();
  let changed = false;
  for (const r of S.recurring){
    if (r.active === false) continue;
    let guard = 0;
    while (r.nextDue <= today && guard++ < 36){
      const already = S.pending.some(p => p.recurringId === r.id && Math.abs(p.ts - r.nextDue) < 43200000);
      if (!already){
        await DB.put("transactions", {
          id:U.uid(), ts:r.nextDue, month:U.monthKey(new Date(r.nextDue)), amount:r.amount,
          type: r.type === "income" ? "income" : "expense", category:r.category,
          note:r.name, source:"recurring", recurringId:r.id, pending:true,
        });
      }
      r.nextDue = advanceDue(r.nextDue, r.cadence, r.intervalDays);
      changed = true;
    }
    if (changed) await DB.put("recurring", r);
  }
  if (changed) await refresh();
}

/* ---- [J] BOOT --------------------------------------------------- */
async function boot(){
  await DB.open();
  await seedIfNeeded();
  await refresh();
  resolveThemeOnBoot();
  startScheduler();
  await rollRecurring();
  go("home");

  if (!(await DB.meta("onboarded", false))) renderOnb();

  // backup nag
  const lb = S.settings.lastBackup ? Date.parse(S.settings.lastBackup) : 0;
  if (Date.now() - lb > 14*86400000){
    setTimeout(() => toast("Backup is " + (lb ? "overdue" : "not set") + " — export from Settings"), 1200);
  }

  // Monthly Wrapped — auto-open in the first 3 days of a new month, once
  const seen = await DB.meta("wrappedSeen", null);
  const pm = prevMonthKey();
  if (U.dayOfMonth() <= 3 && seen !== pm && F.monthTx(pm).length && (await DB.meta("onboarded", false))){
    setTimeout(() => openWrapped(pm), 600);
  }

  // Salary-day "split your salary" nudge
  const lastSplit = await DB.meta("lastSplitMonth", null);
  if (U.dayOfMonth() >= S.settings.salaryDay && lastSplit !== U.monthKey() && !F.planFor(U.monthKey())){
    setTimeout(() => toast("Salary day — open Plan to split it"), 2000);
  }

  updateBadge();

  if ("serviceWorker" in navigator){
    try {
      const hadControllerAtStart = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      // Reload once ONLY when a NEW worker replaces an existing one (a real update),
      // never on the very first install — so first visit doesn't flash-reload.
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshed || !hadControllerAtStart) return;
        refreshed = true; location.reload();
      });
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage({ type:"SKIP_WAITING" });
        });
      });
    } catch(e){ console.warn("SW reg failed (app still works)", e); }
  }
}
async function updateBadge(){
  try {
    if (!("setAppBadge" in navigator)) return;
    const n = notifCount();
    if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){
    refresh().then(() => { updateBadge(); evaluateSchedule(); flushPendingThemeSwitch(); if (currentTab) render(); });
  }
});

boot().catch((err) => {
  console.error("boot failed", err);
  if (window.__rialCrash) window.__rialCrash("boot() failed: " + (err && err.message || err), err && err.stack || "");
});
