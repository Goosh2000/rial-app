/* --- schedule maths (pure, `now` injectable for tests) --- */
function parseHM(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "")); if (!m) return null;
  const h = +m[1], mn = +m[2]; if (h > 23 || mn > 59) return null; return h * 60 + mn; }
function fmtHM(mins){ mins = ((Math.round(mins) % 1440) + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0"); }
function windowActive(w, mins){
  const s = parseHM(w && w.start), e = parseHM(w && w.end);
  if (s == null || e == null || s === e) return false;
  return (s < e) ? (mins >= s && mins < e) : (mins >= s || mins < e);   // wrap past midnight
}
function scheduledThemeAt(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode === "off") return null;
  if (sch.mode === "system"){
    let dark = false;
    try { dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
    return validTheme(dark ? sch.systemDark : sch.systemLight);
  }
  const mins = now.getHours() * 60 + now.getMinutes();
  for (const w of (sch.windows || [])) if (windowActive(w, mins)) return validTheme(w.theme);
  return sch.base ? validTheme(sch.base) : null;
}
function nextBoundaryAfter(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode !== "windows") return null;
  const marks = [...new Set((sch.windows || [])
    .flatMap(w => [parseHM(w.start), parseHM(w.end)]).filter(m => m != null))].sort((a, b) => a - b);
  if (!marks.length) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  let next = marks.find(m => m > mins);
  const d = new Date(now); d.setSeconds(0, 0);
  if (next == null){ next = marks[0]; d.setDate(d.getDate() + 1); }
  d.setHours(Math.floor(next / 60), next % 60, 0, 0);
  return d.getTime();
}
function manualExpired(man, nowTs = Date.now()){
  return !!(man && man.until != null && nowTs >= man.until);
}

/* --- defer switches during interaction --- */
function interactionBusy(){
  try {
    if (SHEET.classList.contains("open")) return true;      // keypad = "typing an amount", edit sheets
    if (FULL.classList.contains("open")) return true;        // settings / overlays / split-salary
    if (ONB && !ONB.hidden) return true;                     // onboarding
    if (document.getElementById("wrapWrap")) return true;    // Monthly Wrapped story
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || "")) return true;
  } catch (_) {}
  return false;
}
let pendingScheduledTheme = null;
function requestThemeSwitch(id, opts = {}){
  id = id && validTheme(id);
  if (!id || currentThemeId() === id){ pendingScheduledTheme = null; return; }
  if (interactionBusy()){ pendingScheduledTheme = id; return; }
  pendingScheduledTheme = null;
  opts.smooth === false ? applyTheme(id) : applyThemeSmooth(id);
}
function flushPendingThemeSwitch(){
  if (pendingScheduledTheme && !interactionBusy()){
    const id = pendingScheduledTheme; pendingScheduledTheme = null;
    applyThemeSmooth(id);
  }
}

/* --- evaluation loop --- */
function evaluateSchedule(now = new Date()){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  if (sch.mode === "off") return;
  let man = S.settings.themeManual;
  if (man && manualExpired(man, now.getTime())){
    S.settings.themeManual = null; man = null;
    DB.setMeta("themeManual", null);
  }
  if (man) return;                                // manual pick still wins
  const want = scheduledThemeAt(now);
  if (want && want !== currentThemeId()){
    requestThemeSwitch(want);
    S.settings.theme = want;
    DB.setMeta("theme", want);
  }
}
let _schedInterval = null, _schedMQBound = false;
function startScheduler(){
  clearInterval(_schedInterval);
  evaluateSchedule();
  _schedInterval = setInterval(() => evaluateSchedule(), 30000);
  if (!_schedMQBound && window.matchMedia){
    try {
      const mq = matchMedia("(prefers-color-scheme: dark)");
      const h = () => {
        // a system light/dark flip is the "boundary" for a system-mode manual override
        const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
        if (sch.mode === "system" && S.settings.themeManual){
          S.settings.themeManual = null; DB.setMeta("themeManual", null);
        }
        evaluateSchedule();
      };
      mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
      _schedMQBound = true;
    } catch (_) {}
  }
}

/* --- what theme to show at startup --- */
function resolveThemeOnBoot(){
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  let man = S.settings.themeManual;
  if (man && manualExpired(man)){ S.settings.themeManual = null; DB.setMeta("themeManual", null); man = null; }
  let id = validTheme(S.settings.theme);
  if (man) id = validTheme(man.theme);
  else if (sch.mode !== "off") id = scheduledThemeAt() || id;
  S.settings.theme = id;
  DB.setMeta("theme", id);
  applyTheme(id);
}

/* --- manual pick / resume (called from settings) --- */
async function pickThemeManually(id){
  id = validTheme(id);
  const sch = S.settings.themeSchedule || DEFAULT_SCHEDULE;
  let man = null;
  if (sch.mode === "windows") man = { theme: id, until: nextBoundaryAfter() };
  else if (sch.mode === "system") man = { theme: id, until: null };
  await DB.setMeta("themeManual", man);
  S.settings.themeManual = man;
  await DB.setMeta("theme", id);
  S.settings.theme = id;
  applyThemeSmooth(id);
}
async function resumeSchedule(){
  await DB.setMeta("themeManual", null);
  S.settings.themeManual = null;
  const want = scheduledThemeAt();
  if (want){ await DB.setMeta("theme", want); S.settings.theme = want; applyThemeSmooth(want); }
}
async function saveSchedule(patch){
  const sch = { ...DEFAULT_SCHEDULE, ...(S.settings.themeSchedule || {}), ...patch };
  sch.windows = (sch.windows || []).map(w => ({ start: w.start, end: w.end, theme: validTheme(w.theme) }));
  if (sch.mode === "off"){ S.settings.themeManual = null; await DB.setMeta("themeManual", null); }
  await DB.setMeta("themeSchedule", sch);
  S.settings.themeSchedule = sch;
  evaluateSchedule();
}

/* ============ [L] THEME LINK SHARING ============================= *
 * A theme travels as https://<pages>/#theme=<payload>. The payload is the
 * URL FRAGMENT only — it never reaches a server. On the receiving side every
 * field is validated STRICTLY: unknown keys, non-strict colours, url()/<>/
 * javascript: etc. => the whole link is rejected, app untouched. Only the
 * palette + a whitelisted font name survive; decorativeCss / fontImports /
 * any audio field are dropped. See THEME-SPEC.md.
 * --------------------------------------------------------------- */
const THEME_LINK = {
  MAX_LINK_CHARS: 2800,      // <#theme=…> payload
  MAX_JSON_BYTES: 4096,      // decoded theme JSON
  PAYLOAD_VERSION: 1,
};
class ThemeLinkError extends Error { constructor(m){ super(m); this.name = "ThemeLinkError"; } }

/* --- url-safe base64 (strict) --- */
function b64urlEncodeBytes(bytes){
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecodeBytes(str){
  if (!/^[A-Za-z0-9_-]*$/.test(str)) throw new ThemeLinkError("Share link is malformed.");
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  let bin;
  try { bin = atob(b64); } catch { throw new ThemeLinkError("Share link is corrupted."); }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function drainStream(readable){
  const reader = readable.getReader();
  const chunks = []; let total = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); total += value.length;
    if (total > THEME_LINK.MAX_JSON_BYTES * 4) throw new ThemeLinkError("Shared theme is too large.");
  }
  const out = new Uint8Array(total); let o = 0;
  for (const c of chunks){ out.set(c, o); o += c.length; }
  return out;
}
async function gzip(bytes){
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter(); w.write(bytes); w.close();
  return drainStream(cs.readable);
}
async function gunzip(bytes){
  const ds = new DecompressionStream("deflate-raw");
  const w = ds.writable.getWriter(); w.write(bytes); w.close();
  return drainStream(ds.readable);
}

/* --- encode / decode --- */
async function encodeThemeLink(theme){
  const json = JSON.stringify(theme);
  let bytes = new TextEncoder().encode(json), marker = "r";
  if (typeof CompressionStream === "function"){
    try { bytes = await gzip(new TextEncoder().encode(json)); marker = "d"; } catch(_) { marker = "r"; bytes = new TextEncoder().encode(json); }
  }
  return marker + b64urlEncodeBytes(bytes);
}
async function decodeThemeLink(payload){
  if (typeof payload !== "string" || payload.length < 2) throw new ThemeLinkError("Empty share link.");
  if (payload.length > THEME_LINK.MAX_LINK_CHARS) throw new ThemeLinkError("This share link is too large to import.");
  const marker = payload[0];
  let bytes = b64urlDecodeBytes(payload.slice(1));
  if (marker === "d"){
    if (typeof DecompressionStream !== "function") throw new ThemeLinkError("This link needs a newer browser to open.");
    bytes = await gunzip(bytes);
  } else if (marker !== "r"){
    throw new ThemeLinkError("Unrecognised share link.");
  }
  if (bytes.length > THEME_LINK.MAX_JSON_BYTES) throw new ThemeLinkError("Shared theme is too large.");
  let obj;
  try { obj = JSON.parse(new TextDecoder().decode(bytes)); }
  catch { throw new ThemeLinkError("Share link is corrupted."); }
  return obj;
}

/* --- strict value validators --- */
const _BAD_SUBSTR = /<|>|url\s*\(|expression|javascript:|@import|\/\*|\*\/|\\|`|\{|\}|;|data:|vbscript:|&#|behaviou?r\s*:|-moz-binding/i;

const _NAMED_COLORS = new Set(("transparent black white red green blue yellow orange purple pink cyan magenta gray grey " +
  "navy teal maroon olive lime aqua silver gold brown coral salmon khaki indigo violet crimson turquoise tomato orchid " +
  "plum slateblue steelblue skyblue royalblue midnightblue darkblue lightblue darkgreen lightgreen seagreen forestgreen " +
  "darkred firebrick darkorange goldenrod chocolate sienna tan beige ivory lavender whitesmoke gainsboro dimgray dimgrey " +
  "darkgray darkgrey lightgray lightgrey slategray slategrey").split(" "));

  const s = v.trim().toLowerCase();

function validateSharedTheme(obj){

    return R("Bad theme name.");
  if (obj.author !== undefined && (typeof obj.author !== "string" || obj.author.length > 40 || !safeStr(obj.author)))
    return R("Bad author.");
  if (obj.scheme !== "light" && obj.scheme !== "dark") return R("Bad scheme.");
  if (!obj.tokens || typeof obj.tokens !== "object" || Array.isArray(obj.tokens)) return R("Missing palette.");
  const keys = Object.keys(obj.tokens);
  if (keys.length < 1 || keys.length > THEME_TOKEN_KEYS.length) return R("Bad palette size.");
  const tokens = {};
  for (const k of keys){
    if (!THEME_TOKEN_KEYS.includes(k)) return R(`Unknown colour "${k}".`);
    if (!validTokenValue(k, obj.tokens[k])) return R(`"${k}" is not a valid ${k === "shadow" ? "shadow" : k.startsWith("r-") ? "size" : "colour"}.`);
    tokens[k] = obj.tokens[k].trim();
  }
  let font;
  if (obj.font !== undefined && obj.font !== null){
    if (typeof obj.font !== "string" || !FONT_NAME_RE.test(obj.font)) return R("Bad font name.");
    font = obj.font;
  }
  return { ok: true, theme: {
    v: 1, id: obj.id, name: obj.name.trim(), scheme: obj.scheme, tokens,
    ...(obj.author ? { author: obj.author.trim() } : {}),
    ...(font ? { font } : {}),
  }};
}

/* --- build the payload for the CURRENT theme (built-in or user) --- */
function serializeThemeForShare(id){
  const t = THEME_REG[id]; if (!t) throw new ThemeLinkError("Unknown theme.");
  const full = t.tokens || {};
  const tokens = {};
  for (const k of THEME_TOKEN_KEYS) if (full[k] && validTokenValue(k, full[k])) tokens[k] = full[k];
  if (!Object.keys(tokens).length) throw new ThemeLinkError("This theme has no shareable palette.");
  const p = { v: 1, id: t.id, name: t.name, scheme: t.scheme === "light" ? "light" : "dark", tokens };
  if (t.fontFamily && FONT_NAME_RE.test(t.fontFamily)) p.font = t.fontFamily;
  return p;
}
function shareBaseUrl(){
  try { return location.origin + location.pathname; } catch { return "https://example.com/"; }
}
async function buildShareLink(id){
  const payload = serializeThemeForShare(id);
  const encoded = await encodeThemeLink(payload);
  if (encoded.length > THEME_LINK.MAX_LINK_CHARS) throw new ThemeLinkError("Theme is too complex to share as a link.");
  return { url: shareBaseUrl() + "#theme=" + encoded, encoded, payload };
}

/* --- export UI actions --- */
async function copyShareLink(){
  try {
    const { url } = await buildShareLink(currentThemeId());
    let copied = false;
    try { await navigator.clipboard.writeText(url); copied = true; } catch(_) {}
    if (!copied){
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { copied = document.execCommand("copy"); } catch(_) {}
      ta.remove();
    }
    toast(copied ? "Share link copied" : "Couldn't copy — long-press the QR screen");
  } catch(e){ toast(e instanceof ThemeLinkError ? e.message : "Couldn't build share link"); }
}
async function showThemeQr(){
  let link;
  try { link = await buildShareLink(currentThemeId()); }
  catch(e){ toast(e instanceof ThemeLinkError ? e.message : "Couldn't build share link"); return; }
  let qrSvg = "";
  try { qrSvg = QR.toSVG(QR.encode(link.url, QR.ECL.L), { border: 3, dark: "#111", light: "#fff" }); }
  catch(_) { qrSvg = ""; }
  openFull(`
    <button class="btn ghost" onclick="closeFull()" style="margin-bottom:8px">← Close</button>
    <div class="pagehead"><h1>Share theme</h1></div>
    <div class="card" style="text-align:center">

        ? `<div style="max-width:260px;margin:0 auto;background:#fff;padding:12px;border-radius:12px">${qrSvg}</div>`
        : `<div class="sched-note">This theme is too large for a QR code — use Copy link.</div>`}
      <p class="tiny faint" style="margin-top:12px">Scan on the other phone, or copy the link. The theme never leaves your device except in this link.</p>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn primary block" id="qrCopy">Copy link</button>
      </div>
      <details style="margin-top:12px"><summary class="tiny faint">Show link text</summary>
        <p class="tiny mono" style="word-break:break-all;margin-top:6px">${esc(link.url)}</p></details>
    </div>
  `);
  const cb = document.getElementById("qrCopy");
  if (cb) cb.addEventListener("click", copyShareLink);

/* --- import from a #theme= fragment (boot) --- */
let pendingImportTheme = null;
function themeFragment(){
  try {
    const m = /(?:^|[#&])theme=([^&]*)/.exec(location.hash || "");
    return m ? decodeURIComponent(m[1]) : null;
  } catch { return null; }
}
function clearThemeFragment(){
  try {
    let h = (location.hash || "").replace(/(^#|&)theme=[^&]*/, "$1").replace(/^#&/, "#").replace(/[#&]$/, "");
    if (h === "#") h = "";
    if (history && history.replaceState) history.replaceState(null, document.title, location.pathname + location.search + h);
    else location.hash = h;
  } catch { try { location.hash = ""; } catch(_) {} }
}
async function handleThemeLinkFragment(){
  const payload = themeFragment();
  if (!payload) return;
  clearThemeFragment();                       // strip it whatever happens
  let obj, err;
  try { obj = await decodeThemeLink(payload); }
  catch(e){ err = e; }
  let theme;
  if (!err){
    const res = validateSharedTheme(obj);
    if (!res.ok) err = new ThemeLinkError(res.error);
    else theme = res.theme;
  }
  if (err){
    setTimeout(() => toast("Theme link rejected: " + (err instanceof ThemeLinkError ? err.message : "invalid")), 700);
    return;                                    // app entirely untouched
  }
  pendingImportTheme = theme;
  setTimeout(() => openThemeImportPreview(theme), 450);
}

function themePreviewMarkup(theme){
  const t = { ...THEMES[THEME_DEFAULT].tokens, ...theme.tokens };
  const vars = THEME_TOKEN_KEYS.map(k => `--${k}:${t[k]}`).join(";");
  return `<div style="${vars};background:var(--bg);color:var(--text);border-radius:12px;padding:14px;border:1px solid var(--line)">
    <div style="font-weight:700;margin-bottom:8px">${esc(theme.name)}</div>
    <div style="background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow)">
      <div style="font-size:11px;color:var(--text-dim);letter-spacing:.04em">SAFE TO SPEND</div>
      <div style="font-size:24px;font-weight:750">OMR 12.500</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <span style="color:var(--pos);font-weight:700">+3.200</span>
        <span style="color:var(--neg);font-weight:700">-1.100</span>
        <span style="color:var(--warn);font-weight:700">pace</span>
      </div>
    </div>
    <button style="margin-top:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r-md);padding:8px 14px;font-weight:700">Save</button>
  </div>`;
}
function openThemeImportPreview(theme){
  const collides = isBuiltInTheme(theme.id);
  openFull(`
    <button class="btn ghost" id="tiCancel" style="margin-bottom:8px">← Cancel</button>
    <div class="pagehead"><h1>Import theme</h1></div>
    <div class="card">
      <div style="font-size:20px;font-weight:750">${esc(theme.name)}</div>
      <div class="tiny faint">${theme.author ? "by " + esc(theme.author) + " · " : ""}${theme.scheme} · ${Object.keys(theme.tokens).length} colours${theme.font ? " · font " + esc(theme.font) : ""}</div>
    </div>
    <div class="card">${themePreviewMarkup(theme)}</div>
    <div class="card">
      <div class="tiny faint">🔒 Audio is not included in shared themes.</div>
      <div class="tiny faint" style="margin-top:4px">🔒 Custom effects (scanlines, System-window borders, animations, extra glows) are not included — a shared theme is the colour palette${theme.font ? " and font name" : ""} only.</div>
      ${theme.font ? `<div class="tiny faint" style="margin-top:4px">The font "${esc(theme.font)}" is loaded from Google Fonts by name.</div>` : ""}
      ${collides ? `<div class="tiny" style="margin-top:6px;color:var(--warn)">A built-in theme already uses the id "${esc(theme.id)}" — this will import as "${esc(theme.id)}-shared".</div>` : ""}
    </div>
    <div class="row" style="gap:10px">
      <button class="btn block" id="tiCancel2">Cancel</button>
      <button class="btn primary block" id="tiImport">Import & apply</button>
    </div>
  `);
  const cancel = () => { pendingImportTheme = null; closeFull(); };
  document.getElementById("tiCancel").addEventListener("click", cancel);
  document.getElementById("tiCancel2").addEventListener("click", cancel);
  document.getElementById("tiImport").addEventListener("click", () => commitThemeImport(theme));
}
async function commitThemeImport(theme){
  let id = theme.id;
  if (isBuiltInTheme(id)) id = (id + "-shared").slice(0, 32);
  while (isBuiltInTheme(id)) id = (id + "x").slice(0, 32);
  const stored = { ...theme, id };
  const list = (S.settings.userThemes || []).filter(x => x.id !== id);
  list.push(stored);
  await DB.setMeta("userThemes", list);
  S.settings.userThemes = list;
  rebuildThemeReg();
  pendingImportTheme = null;
  closeFull();
  await pickThemeManually(id);
  toast("Imported “" + theme.name + "”");
  if (currentTab) render();
}
async function deleteUserTheme(id){
  if (isBuiltInTheme(id)) { toast("Built-in themes can't be deleted"); return; }
  const list = (S.settings.userThemes || []).filter(x => x.id !== id);
  await DB.setMeta("userThemes", list);
  S.settings.userThemes = list;
  if (currentThemeId() === id){
    await DB.setMeta("themeManual", null); S.settings.themeManual = null;
  }
  rebuildThemeReg();
  if (currentThemeId() === id) applyThemeSmooth(THEME_DEFAULT);
  openFull(settingsHTML());
}

/* ---- [I] ONBOARDING ----------------------------------------------- */
const ONB = document.getElementById("onb");
let onbState = { step:0, income:"", salaryDay:"25", savePct:"15", envelopes:["Food","Transport","Boxing/Fitness","Family"] };
const ONB_STEPS = [
  () => `<h2>Welcome to Rial 👋</h2><p class="lead">A private money tracker. Everything stays on this iPhone — no account, no server. Let's set it up in 4 quick steps.</p>
    <div class="pill">Currency: OMR (Omani Rial)</div>`,
  () => `<h2>Your income</h2><p class="lead">Roughly how much do you get each month? Used for "Safe to spend".</p>
    <div class="field"><label>Monthly income (OMR)</label><input id="onbIncome" inputmode="decimal" value="${esc(onbState.income)}" placeholder="e.g. 900" /></div>
    <div class="field"><label>Which day are you paid?</label><input id="onbSalaryDay" inputmode="numeric" value="${esc(onbState.salaryDay)}" /></div>`,
  () => `<h2>Savings target</h2><p class="lead">What share of income do you want to keep? It's held back from Safe-to-Spend.</p>
    <div class="field"><label>Savings target %</label><input id="onbSavePct" inputmode="numeric" value="${esc(onbState.savePct)}" /></div>`,
  () => `<h2>First envelopes</h2><p class="lead">Pick a few spending buckets. You can change these anytime.</p>
    <div class="scroll-x" style="flex-wrap:wrap">
      ${DEFAULT_CATS.filter(c=>!c.isIncome).map(c => `<button class="chip" data-onb-env="${esc(c.name)}" aria-pressed="${onbState.envelopes.includes(c.name)}">${c.icon} ${esc(c.name)}</button>`).join("")}
    </div>`,
];
function renderOnb(){
  ONB.hidden = false;
  ONB.style.display = "flex";
  ONB.innerHTML = `
    <div class="dots">${ONB_STEPS.map((_,i)=>`<i class="${i<=onbState.step?"on":""}"></i>`).join("")}</div>
    <div class="step">${ONB_STEPS[onbState.step]()}</div>
    <div class="row" style="gap:10px">
      ${onbState.step>0 ? `<button class="btn ghost" id="onbBack">Back</button>` : `<button class="btn ghost" id="onbSkip">Skip</button>`}
      <button class="btn primary block" id="onbNext">${onbState.step===ONB_STEPS.length-1?"Finish":"Next"}</button>
    </div>`;
  ONB.querySelectorAll("[data-onb-env]").forEach(b => b.addEventListener("click", () => {
    const n = b.dataset.onbEnv;
    onbState.envelopes = onbState.envelopes.includes(n) ? onbState.envelopes.filter(x=>x!==n) : [...onbState.envelopes, n];
    b.setAttribute("aria-pressed", String(onbState.envelopes.includes(n)));
  }));
  const g = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  ONB.querySelector("#onbNext").addEventListener("click", async () => {
    if (onbState.step === 1){ onbState.income = g("onbIncome"); onbState.salaryDay = g("onbSalaryDay"); }
    if (onbState.step === 2){ onbState.savePct = g("onbSavePct"); }
    if (onbState.step < ONB_STEPS.length - 1){ onbState.step++; renderOnb(); }
    else await finishOnb();
  });
  const back = ONB.querySelector("#onbBack"); if (back) back.addEventListener("click", () => { onbState.step--; renderOnb(); });
  const skip = ONB.querySelector("#onbSkip"); if (skip) skip.addEventListener("click", finishOnb);
}
async function finishOnb(){
  if (onbState.income) await DB.setMeta("monthlyIncome", U.toBaisa(onbState.income));
  if (onbState.salaryDay) await DB.setMeta("salaryDay", U.clamp(parseInt(onbState.salaryDay)||25,1,28));
  if (onbState.savePct) await DB.setMeta("savingsTargetPct", U.clamp(parseInt(onbState.savePct)||0,0,80));
  if (onbState.envelopes?.length) await DB.setMeta("preferredEnvelopes", onbState.envelopes);
  await DB.setMeta("onboarded", true);
  await refresh();
  ONB.hidden = true; ONB.style.display = "none"; ONB.innerHTML = "";
  render();
  afterInteraction();
}

/* ---- recurring rollover (auto-log pending when due) ---- */
function advanceDue(ts, cadence, intervalDays){
  const d = new Date(ts);
  if (cadence === "weekly") d.setDate(d.getDate() + 7);
  else if (cadence === "yearly") d.setFullYear(d.getFullYear() + 1);
  else if (cadence === "custom" && intervalDays) d.setDate(d.getDate() + (intervalDays || 30));
  else d.setMonth(d.getMonth() + 1);
  d.setHours(12, 0, 0, 0);
  return d.getTime();
}
async function rollRecurring(){
  const today = U.todayTs();
  let changed = false;
  for (const r of S.recurring){
    if (r.active === false) continue;
    let guard = 0;
    while (r.nextDue <= today && guard++ < 36){
      const already = S.pending.some(p => p.recurringId === r.id && Math.abs(p.ts - r.nextDue) < 43200000);
      if (!already){
        await DB.put("transactions", {
          id:U.uid(), ts:r.nextDue, month:U.monthKey(new Date(r.nextDue)), amount:r.amount,
          type: r.type === "income" ? "income" : "expense", category:r.category,
          note:r.name, source:"recurring", recurringId:r.id, pending:true,
        });
      }
      r.nextDue = advanceDue(r.nextDue, r.cadence, r.intervalDays);
      changed = true;
    }
    if (changed) await DB.put("recurring", r);
  }
  if (changed) await refresh();
}

/* ---- [J] BOOT --------------------------------------------------- */
async function boot(){
  await DB.open();
  await seedIfNeeded();
  await refresh();
  await handleThemeLinkFragment();        // may queue an import preview; never auto-applies
  resolveThemeOnBoot();
  startScheduler();
  await rollRecurring();
  go("home");

  if (!(await DB.meta("onboarded", false))) renderOnb();

  // backup nag
  const lb = S.settings.lastBackup ? Date.parse(S.settings.lastBackup) : 0;
  if (Date.now() - lb > 14*86400000){
    setTimeout(() => toast("Backup is " + (lb ? "overdue" : "not set") + " — export from Settings"), 1200);
  }

  // Monthly Wrapped — auto-open in the first 3 days of a new month, once
  const seen = await DB.meta("wrappedSeen", null);
  const pm = prevMonthKey();
  if (U.dayOfMonth() <= 3 && seen !== pm && F.monthTx(pm).length && (await DB.meta("onboarded", false))){
    setTimeout(() => openWrapped(pm), 600);
  }

  // Salary-day "split your salary" nudge
  const lastSplit = await DB.meta("lastSplitMonth", null);
  if (U.dayOfMonth() >= S.settings.salaryDay && lastSplit !== U.monthKey() && !F.planFor(U.monthKey())){
    setTimeout(() => toast("Salary day — open Plan to split it"), 2000);
  }

  updateBadge();

  if ("serviceWorker" in navigator){
    try {
      const hadControllerAtStart = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      // Reload once ONLY when a NEW worker replaces an existing one (a real update),
      // never on the very first install — so first visit doesn't flash-reload.
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshed || !hadControllerAtStart) return;
        refreshed = true; location.reload();
      });
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage({ type:"SKIP_WAITING" });
        });
      });
    } catch(e){ console.warn("SW reg failed (app still works)", e); }
  }
}
async function updateBadge(){
  try {
    if (!("setAppBadge" in navigator)) return;
    const n = notifCount();
    if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){
    refresh().then(() => { updateBadge(); evaluateSchedule(); flushPendingThemeSwitch(); if (currentTab) render(); });
  }
});
// a #theme= link pasted into the already-open app is handled too (still shows the preview, never auto-applies)
window.addEventListener("hashchange", () => { if (themeFragment() && !pendingImportTheme) handleThemeLinkFragment(); });

boot().catch((err) => {
  console.error("boot failed", err);
  if (window.__rialCrash) window.__rialCrash("boot() failed: " + (err && err.message || err), err && err.stack || "");
});
